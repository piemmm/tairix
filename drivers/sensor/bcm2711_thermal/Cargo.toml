[package]
name = "tairix-drv-sensor-bcm2711-thermal"
description = "TAIRiX autoloaded user-space driver for the BCM2711 AVS temperature sensor (brcm,bcm2711-thermal): serves the SoC's temperature on its node's thermal-sensor-v1 channel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The thermal-sensor-v1 protocol, the calibration fact and the register seam.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }

[target.'cfg(target_os = "none")'.dependencies]
# The grant-backed host and the sensor channel's serve loop.
tairix-drvrt = { path = "../../../lib/drvrt", version = "=0.0.0" }
# `_start` and the runtime the serve loop calls through.
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }

[build-dependencies]
tairix-buildcfg = { path = "../../../lib/buildcfg", version = "=0.0.0", features = ["std"] }
