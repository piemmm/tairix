[package]
name = "tairix-drv-fs-adfs"
description = "TAIRiX Acorn ADFS filesystem driver (read/write, all FileCore formats)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-bytedev = { path = "../../../lib/bytedev", version = "=0.0.0" }
tairix-fsmeta = { path = "../../../lib/fsmeta", version = "=0.0.0" }
# The ADFS recognition, disc record and map checks the volume probe shares.
tairix-fsprobe = { path = "../../../lib/fsprobe", version = "=0.0.0" }
tairix-hash = { path = "../../../lib/hash", version = "=0.0.0" }

[dev-dependencies]
tairix-fuzzseed = { path = "../../../tests/fuzzseed", version = "=0.0.0" }
# The shared driver listing fixtures (`listing::listed`, `first_listed`).
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0", features = ["test-util"] }

[lints]
workspace = true
