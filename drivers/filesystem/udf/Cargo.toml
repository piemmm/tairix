[package]
name = "tairix-drv-fs-udf"
description = "TAIRiX UDF filesystem driver: OSTA UDF 1.02 to 2.60 read on physical, sparable, virtual (VAT) and metadata partitions; read-write on rewritable and overwritable media; and the formatter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-bytedev = { path = "../../../lib/bytedev", version = "=0.0.0" }
tairix-fsmeta = { path = "../../../lib/fsmeta", version = "=0.0.0" }
# The recognition, descriptor tags, CRC and OSTA Compressed Unicode the volume
# probe shares.
tairix-fsprobe = { path = "../../../lib/fsprobe", version = "=0.0.0" }
tairix-util = { path = "../../../lib/util", version = "=0.0.0" }
# The write-back window an open change is published within.
tairix-writeback = { path = "../../../lib/writeback", version = "=0.0.0" }

[dev-dependencies]
tairix-fuzzseed = { path = "../../../tests/fuzzseed", version = "=0.0.0" }
# The shared driver listing fixtures and the test wall clock.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0", features = ["test-util"] }
# The test host whose clock lets a change wait for the write-back timer.
tairix-writeback = { path = "../../../lib/writeback", version = "=0.0.0", features = ["test-util"] }

[lints]
workspace = true
