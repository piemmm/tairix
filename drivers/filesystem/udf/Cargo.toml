[package]
name = "tairix-drv-fs-udf"
description = "TAIRiX UDF filesystem driver: OSTA UDF 1.02 to 2.60 read on physical, sparable, virtual (VAT) and metadata partitions; read-write on rewritable and overwritable media; and the formatter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The `Run` binary is the driver process `devmgr` loads for a volume node of
# this format. It links the userland runtime, so it is built only with
# `program`, which the bundle builder enables: the kernel links this library
# for its own volumes and must never pull the runtime in with it.
[features]
program = ["dep:tairix-rt", "tairix-fsserve/program"]

[[bin]]
name = "tairix-drv-fs-udf"
path = "src/main.rs"
required-features = ["program"]

[dependencies]
# The served-filesystem runtime: the format trait this driver is served
# through, and its bind key.
tairix-fsserve = { path = "../../../lib/fsserve", version = "=0.0.0" }
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-bytedev = { path = "../../../lib/bytedev", version = "=0.0.0" }
# The holds the kernel takes on nodes: an index whose growth is refused, not
# aborted, when the heap runs out.
tairix-collections = { path = "../../../lib/collections", version = "=0.0.0" }
tairix-fsmeta = { path = "../../../lib/fsmeta", version = "=0.0.0" }
# The recognition, descriptor tags, CRC and OSTA Compressed Unicode the volume
# probe shares.
tairix-fsprobe = { path = "../../../lib/fsprobe", version = "=0.0.0" }
tairix-util = { path = "../../../lib/util", version = "=0.0.0" }
# The write-back window an open change is published within.
tairix-writeback = { path = "../../../lib/writeback", version = "=0.0.0" }

[dev-dependencies]
# The pressure gauge a served open's write-back budget names.
tairix-reclaim = { path = "../../../lib/reclaim", version = "=0.0.0" }
tairix-fuzzseed = { path = "../../../tests/fuzzseed", version = "=0.0.0" }
# The shared driver listing fixtures and the test wall clock.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0", features = ["test-util"] }
# The test host whose clock lets a change wait for the write-back timer.
tairix-writeback = { path = "../../../lib/writeback", version = "=0.0.0", features = ["test-util"] }

[lints]
workspace = true

# The `Run` binary's runtime, pulled only by `program`.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }

[build-dependencies]
tairix-buildcfg = { path = "../../../lib/buildcfg", version = "=0.0.0", features = ["std"] }
