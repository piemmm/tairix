[package]
name = "tairix-drv-fs-iso9660"
description = "TAIRiX ISO 9660 filesystem driver (read-only): ECMA-119 and High Sierra, Joliet and the ISO 9660:1999 enhanced tree, Rock Ridge, RISC OS filetypes, zisofs, multi-extent and interleaved files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-bytedev = { path = "../../../lib/bytedev", version = "=0.0.0" }
# zisofs blocks are zlib streams.
tairix-compress = { path = "../../../lib/compress", version = "=0.0.0" }
# The alias an over-long name is listed under carries a digest of the name.
tairix-crc32 = { path = "../../../lib/crc32", version = "=0.0.0" }
tairix-fsmeta = { path = "../../../lib/fsmeta", version = "=0.0.0" }
# The recognition, descriptors and directory records the volume probe shares.
tairix-fsprobe = { path = "../../../lib/fsprobe", version = "=0.0.0" }
tairix-util = { path = "../../../lib/util", version = "=0.0.0" }

[dev-dependencies]
tairix-fuzzseed = { path = "../../../tests/fuzzseed", version = "=0.0.0" }
# The discs the tests and the fuzz seeds mount, mastered from the
# specifications apart from this reader.
tairix-test-iso9660-image = { path = "../../../tests/integration/iso9660_image", version = "=0.0.0" }
# The shared driver listing fixtures (`listing::listed`, `first_listed`).
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0", features = ["test-util"] }

[lints]
workspace = true
