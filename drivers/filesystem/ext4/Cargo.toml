[package]
name = "tairix-drv-fs-ext4"
description = "TAIRiX ext4 filesystem driver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The shared filesystem-signature definitions (the ext superblock magic),
# so this driver and the volume manager's probe can never disagree.
tairix-fsprobe = { path = "../../../lib/fsprobe", version = "=0.0.0" }
# CRC-32C's one definition, whose register continuation serves the
# `metadata_csum` seeds.
tairix-crc32c = { path = "../../../lib/crc32c", version = "=0.0.0" }
# The keyed per-boot hash an indexed directory's listing cursors are drawn
# from, so no name can be chosen to collide with another's.
tairix-hash = { path = "../../../lib/hash", version = "=0.0.0" }
# Byte-addressed access to the device beneath the volume's blocks.
tairix-bytedev = { path = "../../../lib/bytedev", version = "=0.0.0" }
# Fallible zeroed buffers: block-sized scratch lives on the heap, not on the
# small kernel stack the driver's paths nest on.
tairix-util = { path = "../../../lib/util", version = "=0.0.0" }
# The budget, pressure gauge and pinned-memory ledger the open transaction
# is bounded by.
tairix-reclaim = { path = "../../../lib/reclaim", version = "=0.0.0" }
# The shared write-back core: the staged-block set with per-operation undo,
# the commit window and the machine-wide bound.
tairix-writeback = { path = "../../../lib/writeback", version = "=0.0.0" }

[dev-dependencies]
# The shared driver listing fixtures (`listing::listed`, `first_listed`).
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0", features = ["test-util"] }
tairix-writeback = { path = "../../../lib/writeback", version = "=0.0.0", features = ["test-util"] }
# The seeded PRNG and budget the mount fuzz harness draws from.
tairix-fuzzseed = { path = "../../../tests/fuzzseed", version = "=0.0.0" }

[lints]
workspace = true
