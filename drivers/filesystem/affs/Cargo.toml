[package]
name = "tairix-drv-fs-affs"
description = "TAIRiX AmigaDOS filesystem driver (OFS and FFS; read/write)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The `Run` binary is the driver process `devmgr` loads for a volume node of
# this format. It links the userland runtime, so it is built only with
# `program`, which the bundle builder enables.
[features]
program = ["dep:tairix-rt", "tairix-fsserve/program"]

[[bin]]
name = "tairix-drv-fs-affs"
path = "src/main.rs"
required-features = ["program"]

[dependencies]
# The served-filesystem runtime: the format trait this driver is served
# through, and its bind key.
tairix-fsserve = { path = "../../../lib/fsserve", version = "=0.0.0" }
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-bytedev = { path = "../../../lib/bytedev", version = "=0.0.0" }
# The index the kernel's holds on the volume's objects are kept in, which
# grows fallibly.
tairix-collections = { path = "../../../lib/collections", version = "=0.0.0" }
# The Amiga metadata preset: protection, comment, date stamps.
tairix-fsmeta = { path = "../../../lib/fsmeta", version = "=0.0.0" }
# The AmigaDOS recognition, layout and checksum the volume probe shares.
tairix-fsprobe = { path = "../../../lib/fsprobe", version = "=0.0.0" }
# Fallible buffers.
tairix-util = { path = "../../../lib/util", version = "=0.0.0" }
# The dirty-age commit scheduler a transaction is published by.
tairix-writeback = { path = "../../../lib/writeback", version = "=0.0.0" }

[dev-dependencies]
tairix-fuzzseed = { path = "../../../tests/fuzzseed", version = "=0.0.0" }
# The shared driver fixtures: the listing helpers and the test wall clock.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0", features = ["test-util"] }
# The settable host a transaction's window is driven through.
tairix-writeback = { path = "../../../lib/writeback", version = "=0.0.0", features = ["test-util"] }

[lints]
workspace = true

# The `Run` binary's runtime, pulled only by `program`.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }

[build-dependencies]
tairix-buildcfg = { path = "../../../lib/buildcfg", version = "=0.0.0", features = ["std"] }
