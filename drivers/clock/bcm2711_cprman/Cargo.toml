[package]
name = "tairix-drv-clock-bcm2711-cprman"
description = "TAIRiX autoloaded user-space driver for the BCM2711 clock manager (brcm,bcm2711-cprman): serves clock-v1 for the audio blocks' clocks, making each rate from the sources the firmware leaves fixed and never retuning a clock another consumer holds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Two targets, one crate, on cargo's default paths and names like every sibling
# driver: the bundle builder cross-compiles `--bin <package>`. The generators
# (`src/lib.rs`) are host-testable against a register-level model, alone and
# behind the shared `clock-v1` endpoint; the `Run` binary (`src/main.rs`) links
# the userland runtime, so it is freestanding-only and an inert host stub
# elsewhere (`build.rs`).

[dependencies]
# The register seam and the driver-error vocabulary.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The `clock-v1` endpoint the generators are served through, and the node
# bring-up around it.
tairix-clock = { path = "../../../lib/clock", version = "=0.0.0" }

[dev-dependencies]
# The endpoint rig and the fake kernel its tests are answered through.
tairix-clock = { path = "../../../lib/clock", version = "=0.0.0", features = ["test-support"] }
# The endpoint walk draws its steps through the shared seed seam, so a failing
# run is reproducible from its logged seed. Test scaffolding only.
tairix-fuzzseed = { path = "../../../tests/fuzzseed", version = "=0.0.0" }

[target.'cfg(target_os = "none")'.dependencies]
# The one vocabulary the driver ends with.
tairix-drvrt = { path = "../../../lib/drvrt", version = "=0.0.0" }
# `_start`.
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }
