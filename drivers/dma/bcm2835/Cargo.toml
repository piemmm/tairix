[package]
name = "tairix-drv-dma-bcm2835"
description = "TAIRiX autoloaded user-space driver for the Broadcom legacy DMA engines (brcm,bcm2835-dma): builds every control block itself and serves the node's dmaengine-v1 endpoint, so a consumer driver streams through a cyclic channel without ever naming an address."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Two targets, one crate, on cargo's default paths and names like every sibling
# driver: the bundle builder cross-compiles `--bin <package>`. The engine and
# the endpoint (`src/lib.rs`) are host-testable against a register-level model;
# the `Run` binary (`src/main.rs`) links the userland runtime, so it is
# freestanding-only and an inert host stub elsewhere (`build.rs`).

[dependencies]
# The `dmaengine-v1` class traits, the hardware-tree records the engines check,
# the register seam and the DMA carve seam.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The write barrier between building a chain and starting the channel on it.
tairix-dma-barrier = { path = "../../../lib/dma-barrier", version = "=0.0.0" }

[dev-dependencies]
# The rule the device manager matched the node by, which picks the engine.
tairix-devmatch = { path = "../../../lib/devmatch", version = "=0.0.0" }
# The endpoint the engines are served through, driven over them in the tests.
tairix-dmaengine = { path = "../../../lib/dmaengine", version = "=0.0.0" }
# The fake kernel the endpoint tests are answered through.
tairix-drvrt = { path = "../../../lib/drvrt", version = "=0.0.0", features = ["test-support"] }
# The endpoint walk draws its steps through the shared seed seam, so a failing
# run is reproducible from its logged seed. Test scaffolding only.
tairix-fuzzseed = { path = "../../../tests/fuzzseed", version = "=0.0.0" }

[target.'cfg(target_os = "none")'.dependencies]
# The rule the device manager matched the node by, which picks the engine.
tairix-devmatch = { path = "../../../lib/devmatch", version = "=0.0.0" }
# The node's bring-up and the endpoint's serve loop.
tairix-dmaengine = { path = "../../../lib/dmaengine", version = "=0.0.0" }
# `_start` and the driver's own node record.
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }
