[package]
name = "tairix-drv-display-rpi-fb"
description = "TAIRiX Raspberry Pi firmware-framebuffer display service: presents the VideoCore firmware's scan-out surface through the shared display-service engine, and switches the display off through the firmware's blank request."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Two targets, one crate, on cargo's default paths like every sibling driver.
# The device logic (`src/lib.rs`) is this surface's own power request and its
# bind table, host-testable against the mock firmware. The `Run` binary
# (`src/main.rs`) is what `devmgr` autoloads; it links the userland runtime,
# so it is freestanding-only and an inert host stub elsewhere (`build.rs`).

[dependencies]
# The `abi-v1` surface: the `Display` trait, the bind-table types, the
# mailbox channel seam and the capability ids.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The VideoCore property-channel client: the blank request, its fail-closed
# response validation, and the binding name the port publishes the surface
# under. One definition of that protocol.
tairix-vcmailbox = { path = "../../../lib/vcmailbox", version = "=0.0.0" }

[dev-dependencies]
# The protocol-faithful mock firmware the host tests switch the output
# against; QEMU models no VideoCore.
tairix-vcmailbox = { path = "../../../lib/vcmailbox", version = "=0.0.0", features = [
    "mock-firmware",
] }

# The `Run` binary's freestanding-only dependencies.
[target.'cfg(target_os = "none")'.dependencies]
# The capability-set type the rt-backed `DriverHost` is built over.
tairix-caps = { path = "../../../lib/caps", version = "=0.0.0" }
# The one display-service loop and the linear-surface engine.
tairix-display = { path = "../../../lib/display", version = "=0.0.0", features = ["service"] }
# The user-space driver runtime: maps the granted surface, and its
# `MailboxChannel` marshals the blank request to the mailbox service.
tairix-drvrt = { path = "../../../lib/drvrt", version = "=0.0.0" }
# The pure-Rust userland runtime: `_start`, the stack canary and the panic
# handler.
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }
