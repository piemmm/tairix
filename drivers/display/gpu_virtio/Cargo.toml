[package]
name = "tairix-drv-display-gpu-virtio"
description = "TAIRiX virtio-gpu display driver: the 2D device as the seat's display, its frames the backings of device resources so a present copies no pixel, its pointer the device's cursor, and the kernel console the node hosts shown on it; its BIND_KEYS identity and the autoloaded user-space Run process serving DISPLAY_ENDPOINT."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The host-testable engine (`VirtioGpu`), the `BIND_KEYS` match table and the
# `register` entry are the `lib` target, co-located in the driver because a
# display adapter has no charter-legal non-driver consumer. `src/main.rs` is
# the `Run` binary the signed bundle installs; it links the userland runtime,
# so its dependencies are pulled in only for the bare-metal targets it is
# built for.
[dependencies]
# The `Display` and `HardwareCursor` class traits, the hosted console's
# record, and the discovery identity.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The memory a presenter's buffers are carved in, the frames budget, and the
# row copy a pointer image is taken with.
tairix-display = { path = "../../../lib/display", version = "=0.0.0" }
# The recorder the engine's decisions go to.
tairix-drvrt = { path = "../../../lib/drvrt", version = "=0.0.0" }
# The preferred timing of a sink a scanout names no size for.
tairix-edid = { path = "../../../lib/edid", version = "=0.0.0" }
# Bounded containers: the buffers, a batch's commands and chains.
tairix-inline = { path = "../../../lib/inline", version = "=0.0.0" }
# The bus-agnostic virtio split-virtqueue protocol.
tairix-virtio = { path = "../../../lib/virtio", version = "=0.0.0" }

[target.'cfg(target_os = "none")'.dependencies]
# The one display-service loop, and the device memory frames are carved in.
tairix-display = { path = "../../../lib/display", version = "=0.0.0", features = ["service"] }
# Every decision recorded with a stable event id.
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
# `_start`, the console it hosts, the interrupt it parks on.
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }

[dev-dependencies]
# Heap regions standing in for device memory.
tairix-display = { path = "../../../lib/display", version = "=0.0.0", features = ["test-support"] }
# The recorder the tests read decisions back from.
tairix-drvrt = { path = "../../../lib/drvrt", version = "=0.0.0", features = ["test-support"] }
# A sink's EDID, built for the test.
tairix-edid = { path = "../../../lib/edid", version = "=0.0.0", features = ["test-support"] }
tairix-virtio = { path = "../../../lib/virtio", version = "=0.0.0", features = ["mock"] }

[build-dependencies]
tairix-buildcfg = { path = "../../../lib/buildcfg", version = "=0.0.0", features = ["std"] }
