[package]
name = "tairix-drv-display-gpu-virtio"
description = "TAIRiX virtio-gpu display driver: the device as the seat's display, its frames the backings of device resources so a present copies no pixel, its pointer the device's cursor, and the kernel console the node hosts shown on it; where the device offers Venus, its contexts, host blobs mapped into the host-visible region and command streams, each answered in its own time, served as a GPU on its node's channel; its BIND_KEYS identity and the autoloaded user-space Run process serving DISPLAY_ENDPOINT."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The Venus reply builders and the rounds `tests/fuzz_venus_replies.rs` runs.
test-support = []

# The host-testable engine (`VirtioGpu`), the `BIND_KEYS` match table and the
# `register` entry are the `lib` target, co-located in the driver because a
# display adapter has no charter-legal non-driver consumer. `src/main.rs` is
# the `Run` binary the signed bundle installs; it links the userland runtime,
# so its dependencies are pulled in only for the bare-metal targets it is
# built for.
[dependencies]
# The `Display` and `HardwareCursor` class traits, the hosted console's
# record, and the discovery identity.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The memory a presenter's buffers are carved in, the frames budget, and the
# row copy a pointer image is taken with.
tairix-display = { path = "../../../lib/display", version = "=0.0.0" }
# The recorder the engine's decisions go to.
tairix-drvrt = { path = "../../../lib/drvrt", version = "=0.0.0" }
# The preferred timing of a sink a scanout names no size for.
tairix-edid = { path = "../../../lib/edid", version = "=0.0.0" }
# Bounded containers: the buffers, a batch's commands and chains.
tairix-inline = { path = "../../../lib/inline", version = "=0.0.0" }
# The generational tables a context's and a blob's handles name.
tairix-collections = { path = "../../../lib/collections", version = "=0.0.0" }
# The GPU seam a Venus context serves: the model its jobs are checked and
# ordered by, the hardware backend it drives, and the runtime serving it.
tairix-gpu = { path = "../../../lib/gpu", version = "=0.0.0" }
# The check an indirect dispatch's counts are held to on the device.
tairix-shaders = { path = "../../../lib/shaders", version = "=0.0.0" }
# The modules a pipeline is made of, folded as the host compiles them.
tairix-spirv = { path = "../../../lib/spirv", version = "=0.0.0" }
# The claims a Venus context's jobs hold their feedback slots by.
tairix-sync = { path = "../../../lib/sync", version = "=0.0.0" }
# The rounding a host's viewport bounds are stated with.
tairix-util = { path = "../../../lib/util", version = "=0.0.0" }
# The bus-agnostic virtio split-virtqueue protocol.
tairix-virtio = { path = "../../../lib/virtio", version = "=0.0.0" }
# `_start`, the console it hosts, the interrupt it parks on, and the lock and
# condition variable the GPU's threads and the display loop meet under.
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }

[target.'cfg(target_os = "none")'.dependencies]
# The one display-service loop, and the device memory frames are carved in.
tairix-display = { path = "../../../lib/display", version = "=0.0.0", features = ["service"] }
# Every decision recorded with a stable event id.
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[dev-dependencies]
# Heap regions standing in for device memory.
tairix-display = { path = "../../../lib/display", version = "=0.0.0", features = ["test-support"] }
# The recorder the tests read decisions back from.
tairix-drvrt = { path = "../../../lib/drvrt", version = "=0.0.0", features = ["test-support"] }
# A sink's EDID, built for the test.
tairix-edid = { path = "../../../lib/edid", version = "=0.0.0", features = ["test-support"] }
tairix-virtio = { path = "../../../lib/virtio", version = "=0.0.0", features = ["mock"] }
# The seeded generator and budget the answer-decoding fuzz harnesses run on.
tairix-fuzzseed = { path = "../../../tests/fuzzseed", version = "=0.0.0" }
# The Venus reply rounds, for the harness that drives them.
tairix-drv-display-gpu-virtio = { path = ".", version = "=0.0.0", features = ["test-support"] }
# The runner the test host's software device runs its dispatches on.
tairix-parallel = { path = "../../../lib/parallel", version = "=0.0.0" }
# The assembler the image dispatch tests write their modules in.
tairix-spirv = { path = "../../../lib/spirv", version = "=0.0.0", features = ["test-support"] }

[build-dependencies]
tairix-buildcfg = { path = "../../../lib/buildcfg", version = "=0.0.0", features = ["std"] }
