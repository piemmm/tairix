[package]
name = "tairix-drv-display-bcm2711-hvs"
description = "TAIRiX Raspberry Pi 4 display engine: drives the HVS and the pixel valves feeding the HDMI outputs natively, taking the display over from the firmware, and serves the seat's display from frames no channel reads while they are written."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The `Display` trait, `encoder-v1`'s limits and phases, the register seam
# and the capability ids.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The recorder the engine's decisions go to.
tairix-drvrt = { path = "../../../lib/drvrt", version = "=0.0.0" }
# Bounded containers: the outputs, a plane's words, a frame's damage.
tairix-inline = { path = "../../../lib/inline", version = "=0.0.0" }
# The encoders' and the core clock's clients.
tairix-linkclient = { path = "../../../lib/linkclient", version = "=0.0.0" }
# The binding name the mailbox service admits the takeover notice for, and
# the notice's framing.
tairix-vcmailbox = { path = "../../../lib/vcmailbox", version = "=0.0.0" }

[dev-dependencies]
# The encoder server the tests' encoders are answered through, so the engine
# meets the phase order it would on metal.
tairix-encoder = { path = "../../../lib/encoder", version = "=0.0.0" }
# The fake kernel those encoders' callers are attested by.
tairix-drvrt = { path = "../../../lib/drvrt", version = "=0.0.0", features = ["test-support"] }

[target.'cfg(target_os = "none")'.dependencies]
# The one display-service loop.
tairix-display = { path = "../../../lib/display", version = "=0.0.0", features = ["service"] }
# Every decision recorded with a stable event id.
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
# `_start`, the clock the mode sets wait on, the link calls.
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }
