[package]
name = "tairix-drv-gpio-bcm2835"
description = "TAIRiX autoloaded user-space driver for the BCM2835-family GPIO controller (brcm,bcm2711-gpio): serves its node's irqline-v1 endpoint to the devices wired to its lines and lends its board header's lines to system services over gpio-header-v1."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The irqline-v1 and gpio-header-v1 protocols, the link records the server
# checks, and the register seam.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The supplier seam the server asks the kernel about its callers through.
tairix-drvrt = { path = "../../../lib/drvrt", version = "=0.0.0" }

[dev-dependencies]
# The fake kernel the server's tests are answered through.
tairix-drvrt = { path = "../../../lib/drvrt", version = "=0.0.0", features = ["test-support"] }

[target.'cfg(target_os = "none")'.dependencies]
# Every decision the server takes, recorded with a stable event id.
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
# `_start`, the wait set, the endpoints and the bank interrupts.
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }

[build-dependencies]
tairix-buildcfg = { path = "../../../lib/buildcfg", version = "=0.0.0", features = ["std"] }
