[package]
name = "tairix-drv-bus-i2c-bcm2835"
description = "TAIRiX autoloaded user-space Broadcom Serial Controller (BSC) I2C bus driver: binds the discovered brcm,bcm2835-i2c node and serves i2c-v1 under its I2C duty, each transaction paced by the controller's interrupts and joined by chained repeated STARTs, the bus run at its declared speed from the VPU clock."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Two targets, one crate, both on cargo's default paths and names like every
# sibling driver — the bundle builder cross-compiles `--bin <package>`. The
# controller (`src/lib.rs`) is the BSC's own register sequence, host-testable
# against a simulated controller; the `Run` binary (`src/main.rs`) links the
# userland runtime, so it is freestanding-only and an inert host stub
# elsewhere (`build.rs`).

[dependencies]
# The transaction, its messages and faults, the register-window seam, and the
# capability ids.
tairix-abi = { path = "../../../../lib/abi", version = "=0.0.0" }
# The `i2c-v1` endpoint the controller is served through.
tairix-i2cbus = { path = "../../../../lib/i2cbus", version = "=0.0.0" }

[target.'cfg(target_os = "none")'.dependencies]
# The node's grants, the register window and the bound interrupt line.
tairix-drvrt = { path = "../../../../lib/drvrt", version = "=0.0.0" }
# The VPU clock, described through the node's clock link.
tairix-linkclient = { path = "../../../../lib/linkclient", version = "=0.0.0" }
# `_start`, the monotonic clock, and the interrupt wait.
tairix-rt = { path = "../../../../lib/rt", version = "=0.0.0" }
