[package]
name = "tairix-drv-audio-bcm2711-i2s"
description = "TAIRiX autoloaded user-space driver for the BCM2711's PCM/I2S block: a cyclic DMA channel into its FIFO, its bit and frame clocks driven from the clock manager or followed from the codec as the sound card's link states, composed with the codec driver over codec-v1, serving audiochan-v1 to the mixer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Two targets, one crate, on cargo's default paths and names like every sibling
# driver: the bundle builder cross-compiles `--bin <package>`. The block and
# the interface (`src/lib.rs`) are host-testable; the `Run` binary
# (`src/main.rs`) links the userland runtime, so it is freestanding-only and an
# inert host stub elsewhere (`build.rs`).

[dependencies]
# The audio class trait, the PCM ring, the link records and the codec's DAI
# vocabulary, the register seam.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The cyclic-DMA playback engine the interface streams through, and in the
# driver process the audiochan-v1 serve loop it is served through.
tairix-audiochan = { path = "../../../lib/audiochan", version = "=0.0.0" }
# The clock and codec clients the interface composes, reached through the
# links the node holds.
tairix-linkclient = { path = "../../../lib/linkclient", version = "=0.0.0" }

[dev-dependencies]
# The modelled DMA channel the interface's tests drive the engine over.
tairix-audiochan = { path = "../../../lib/audiochan", version = "=0.0.0", features = ["mock-dma"] }

[target.'cfg(target_os = "none")'.dependencies]
# The capability-set type the rt-backed host is built over.
tairix-caps = { path = "../../../lib/caps", version = "=0.0.0" }
# The node's grants and its register window.
tairix-drvrt = { path = "../../../lib/drvrt", version = "=0.0.0" }
# `_start`.
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }
