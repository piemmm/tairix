[package]
name = "tairix-drv-input-virtio-kbd"
description = "TAIRiX autoloaded user-space virtio-input keyboard/pointer driver process: shape-keys the bus-agnostic virtio transport from its granted windows (a single virtio-MMIO aperture or the four role-tagged virtio-PCI config windows) and a `VirtioHost` over its granted DMA, brings the virtio-input device up via `lib/virtio_input`, and pumps decoded key/pointer records into the kernel input-focus arbiter (plans/PI.md P10 chunk 5d-2-ii)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Two targets: the `Run` entry point of the driver bundle (`src/main.rs`),
# autoloaded into user space by `devmgr`, and the capabilities its signed
# manifest requests (`src/lib.rs`), which the image builder reads too. It links
# the userland runtime `tairix-rt`, so it is a separate crate from
# the kernel-linked `tairix-drv-input-virtio-input` driver shell (the kernel must not pull in the userland `_start` / panic handler),
# and depends only on `lib/*` crates so the layering holds. The binary is an
# inert host stub off bare metal (`build.rs`).

[dependencies]
# The capability vocabulary the manifest request is spelled in.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }

# Everything else the freestanding program links is pulled in only for the
# bare-metal targets the binary is actually built for.
[target.'cfg(target_os = "none")'.dependencies]
# The bus-agnostic virtio transports this driver builds over its granted
# window(s) — the single-aperture `MmioTransport` and the four-window
# `PciTransport` — a `lib/*` crate, so the layering holds (the driver
# never names `drivers/bus/virtio`; the `lib/usb` ↔ `drivers/bus/usb` precedent).
tairix-virtio = { path = "../../../lib/virtio", version = "=0.0.0" }
# The arch-neutral virtio-input open/poll/decode device logic and the
# `evdev`-keycode console producer this process composes — a `lib/*` crate
# (the same logic the in-kernel `-M virt` verticals use).
tairix-virtio-input = { path = "../../../lib/virtio_input", version = "=0.0.0" }
# The user-space driver runtime: turns the kernel-issued device-resource grants
# into the `MmioMapper` + `VirtioHost` the bring-up consumes (`mmio_map` /
# `dma_alloc` / `resource_grants` over the syscall surface).
tairix-drvrt = { path = "../../../lib/drvrt", version = "=0.0.0" }
# The pure-Rust userland runtime: `_start`, the stack
# canary, the panic handler, and the syscall wrappers (`key_inject`, `yield`).
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }
