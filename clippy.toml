# Clippy configuration for TAIRiX.
#
# Lint *selection* lives in the workspace `Cargo.toml` (`[workspace.lints]`).
# This file only tunes thresholds for lints that are kept enabled.

cognitive-complexity-threshold = 20
too-many-arguments-threshold = 7
type-complexity-threshold = 250
avoid-breaking-exported-api = true
# Only crates whose output must agree to the bit on every target deny these
# (`#![deny(clippy::disallowed_methods)]`); the lint is allowed elsewhere.
disallowed-methods = [
    { path = "f64::max", reason = "returns either zero on a signed-zero tie; take tairix_util::mathf::fmax" },
    { path = "f64::min", reason = "returns either zero on a signed-zero tie; take tairix_util::mathf::fmin" },
    { path = "f32::max", reason = "returns either zero on a signed-zero tie; compare explicitly" },
    { path = "f32::min", reason = "returns either zero on a signed-zero tie; compare explicitly" },
]
disallowed-types = []

# Project-specific names that legitimately appear in docs without backticks.
# `doc-valid-idents` *extends* clippy's built-in allowlist (which already
# covers Rust, LLVM, x86, etc.); we add domain terms that belong to TAIRiX.
