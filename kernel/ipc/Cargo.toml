[package]
name = "tairix-kernel-ipc"
description = "TAIRiX kernel IPC: capability-checked message ports, shared memory, and asynchronous notifications."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tairix-sync = { path = "../../lib/sync", version = "=0.0.0" }
# The per-sender lanes, the calls in service and the room waiters are found by
# hash, so no lookup grows with the number of senders an endpoint has.
tairix-collections = { path = "../../lib/collections", version = "=0.0.0" }
tairix-hash = { path = "../../lib/hash", version = "=0.0.0" }
tairix-kernel-mem = { path = "../mem", version = "=0.0.0" }
tairix-kernel-sec = { path = "../sec", version = "=0.0.0" }
tairix-abi = { path = "../../lib/abi", version = "=0.0.0" }
tairix-caps = { path = "../../lib/caps", version = "=0.0.0" }
tairix-log = { path = "../../lib/log", version = "=0.0.0" }
tairix-util = { path = "../../lib/util", version = "=0.0.0" }

# The Bronze stateful model (`tests/proptest_model.rs`) drives the
# capability-checked port endpoint under randomised command sequences. Same
# pinned, already-audited version the other kernel crates use; dev-only.
[dev-dependencies]
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }
# The model drives its programs through the shared seed/budget runner
# (`tairix_fuzzseed::prop::drive`), so the seed selection, start-of-test
# seed log, and smoke/soak loop live in one place. Test
# scaffolding only; never in a TAIRiX build.
tairix-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0", features = ["proptest"] }


# Loom, linked only into the models `cargo xtask loom` builds under
# `--cfg loom`.
[target.'cfg(loom)'.dependencies]
loom = "0.7"
