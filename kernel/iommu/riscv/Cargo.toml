[package]
name = "tairix-kernel-iommu-riscv"
description = "TAIRiX RISC-V IOMMU translation unit: the device directory, second stage (first stage where absent) page tables, the command queue with IOFENCE.C, the fault queue."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tairix-arch-api = { path = "../../arch/api", version = "=0.0.0" }
tairix-collections = { path = "../../../lib/collections", version = "=0.0.0" }
tairix-dma-barrier = { path = "../../../lib/dma-barrier", version = "=0.0.0" }
tairix-hash = { path = "../../../lib/hash", version = "=0.0.0" }
tairix-kernel-iommu-api = { path = "../api", version = "=0.0.0" }
tairix-sync = { path = "../../../lib/sync", version = "=0.0.0" }

[dev-dependencies]
tairix-kernel-iommu-api = { path = "../api", version = "=0.0.0", features = ["host-tests"] }
