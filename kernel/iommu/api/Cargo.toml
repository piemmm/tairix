[package]
name = "tairix-kernel-iommu-api"
description = "TAIRiX DMA translation contract: the unit interface every IOMMU family implements, domains, the IOVA space, the generic radix I/O page-table engine, and the conformance suite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The host frame arena and the conformance suite, for the family crates'
# register-model tests. Never in a production build.
host-tests = []

[dependencies]
tairix-arch-api = { path = "../../arch/api", version = "=0.0.0" }
tairix-collections = { path = "../../../lib/collections", version = "=0.0.0" }
tairix-dma-barrier = { path = "../../../lib/dma-barrier", version = "=0.0.0" }
tairix-hash = { path = "../../../lib/hash", version = "=0.0.0" }
tairix-sync = { path = "../../../lib/sync", version = "=0.0.0" }

[dev-dependencies]
tairix-kernel-iommu-api = { path = ".", version = "=0.0.0", features = ["host-tests"] }
