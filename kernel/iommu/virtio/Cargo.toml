[package]
name = "tairix-kernel-iommu-virtio"
description = "TAIRiX virtio-iommu translation unit: attach, map, unmap and probe over the request queue, faults from the event queue, bypass off, each domain shadowed so it can be replayed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tairix-arch-api = { path = "../../arch/api", version = "=0.0.0" }
tairix-collections = { path = "../../../lib/collections", version = "=0.0.0" }
tairix-hash = { path = "../../../lib/hash", version = "=0.0.0" }
tairix-inline = { path = "../../../lib/inline", version = "=0.0.0" }
tairix-kernel-iommu-api = { path = "../api", version = "=0.0.0" }
tairix-sync = { path = "../../../lib/sync", version = "=0.0.0" }
tairix-virtio = { path = "../../../lib/virtio", version = "=0.0.0" }

[dev-dependencies]
tairix-fuzzseed = { path = "../../../tests/fuzzseed", version = "=0.0.0" }
tairix-kernel-iommu-api = { path = "../api", version = "=0.0.0", features = ["host-tests"] }
