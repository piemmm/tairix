[package]
name = "tairix-kernel-iommu-smmuv3"
description = "TAIRiX Arm SMMUv3 translation unit: stream tables, stage 2 (stage 1 where absent) page tables, the command queue with CMD_SYNC, the event queue."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tairix-arch-api = { path = "../../arch/api", version = "=0.0.0" }
tairix-collections = { path = "../../../lib/collections", version = "=0.0.0" }
tairix-dma-barrier = { path = "../../../lib/dma-barrier", version = "=0.0.0" }
tairix-hash = { path = "../../../lib/hash", version = "=0.0.0" }
tairix-inline = { path = "../../../lib/inline", version = "=0.0.0" }
tairix-kernel-iommu-api = { path = "../api", version = "=0.0.0" }
tairix-sync = { path = "../../../lib/sync", version = "=0.0.0" }

[dev-dependencies]
tairix-kernel-iommu-api = { path = "../api", version = "=0.0.0", features = ["host-tests"] }
