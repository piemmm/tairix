[package]
name = "tairix-test-twins"
description = "docs/src/filesystem/drives.md twin-volume fixture: the `twins` command app the twin-volume QEMU vertical plants on its disk and runs from the scripted root shell. It waits for the two USB sticks' identical FAT32 volumes, checks they attach under one identity and two keys with `id::<identity>` the first, a file's id distinct on each, a write through each landing on its own, and each detached by its key; on failure it parks, so the run fails loudly by timeout. Never planted on a production image."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime and its mount-table client
# are an optional, on-by-default feature, so the host test build of the check
# library never pulls the runtime's `_start`, allocator or panic handler.
[features]
default = ["program"]
program = ["dep:tairix-rt", "dep:tairix-procinfo"]

[[bin]]
name = "tairix-test-twins-run"
path = "src/run.rs"

[dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The durable `id::` spelling a volume's key is named by.
tairix-path = { path = "../../../lib/path", version = "=0.0.0" }

# The `Run` binary reads the mount table through the shared System Information
# client's production transport (`IpcTransport`, behind its `program` feature).
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
tairix-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0", optional = true, features = [
    "program",
] }

# The image the vertical's sticks hold, and the probe and naming policy the
# volume manager names its volumes by, so the names the fixture waits for are
# pinned to them.
[dev-dependencies]
tairix-bytedev = { path = "../../../lib/bytedev", version = "=0.0.0" }
tairix-fsprobe = { path = "../../../lib/fsprobe", version = "=0.0.0" }
tairix-test-fat32-image = { path = "../fat32_image", version = "=0.0.0" }

[build-dependencies]
tairix-buildcfg = { path = "../../../lib/buildcfg", version = "=0.0.0", features = ["std"] }
