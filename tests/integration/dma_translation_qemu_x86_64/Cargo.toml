[package]
name = "tairix-test-dma-translation-qemu-x86-64"
description = "QEMU integration test (plans/IOMMU.md MI0): boot the production x86_64 tairix-kernel pipeline on the q35 machine behind an intel-iommu, every virtio-pci function reaching memory through it (iommu_platform=on), with the whole-disk autoload-root image and a virtio-keyboard-pci device, and prove every DMA in the boot is confined: the kernel takes the VT-d unit the ACPI DMAR describes over, the in-kernel floor disk reads the /System driver store through the kernel's own domain, and the autoloaded user-space virtio-input driver's DMA reaches its buffers only through its node's domain. PASS via QEMU isa-debug-exit once AuditEvent::InputDelivered with kind=key follows AuditEvent::DmaTranslationUnit with outcome=translating; any other unit outcome, or a key delivered before translation started, fails the run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Reuses the entire production x86_64 boot pipeline through `tairix-kernel`'s
# library half and only swaps the audit sink for the witness below. The
# QEMU-exit shortcut stays in this dedicated bin, never a feature on a
# production crate.

[[bin]]
name = "tairix-test-dma-translation-qemu-x86-64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
tairix-arch-x86_64 = { path = "../../../kernel/arch/x86_64", version = "=0.0.0", features = ["sched-arch"] }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
# The audit vocabulary the witness keys on.
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
