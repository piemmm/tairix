[package]
name = "tairix-test-dma-translation-qemu-x86-64"
description = "QEMU integration test (plans/IOMMU.md MI0, MI2): boot the production x86_64 pipeline on q35 behind an intel-iommu, or in the AMD binary an amd-iommu, every virtio-pci function iommu_platform=on and the keyboard behind a PCIe-to-PCI bridge. PASS via isa-debug-exit once a key is delivered after the unit audited translating, interrupts remapped and the keyboard granted bus mastering; any other unit outcome, a translation fault, or a key first fails the run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Reuses the entire production x86_64 boot pipeline through `tairix-kernel`'s
# library half and only swaps the audit sink for the witness below. The
# QEMU-exit shortcut stays in this dedicated bin, never a feature on a
# production crate.

[[bin]]
name = "tairix-test-dma-translation-qemu-x86-64"
path = "src/main.rs"

[[bin]]
name = "tairix-test-dma-translation-amd-qemu-x86-64"
path = "src/amd.rs"

[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
tairix-arch-x86_64 = { path = "../../../kernel/arch/x86_64", version = "=0.0.0", features = ["sched-arch"] }
tairix-itest-translation-witness = { path = "../translation_witness", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
