[package]
name = "tairix-test-appbar-qemu-aarch64"
description = "plans/NEW-TASKBAR.md QEMU integration test: boot the graphical desktop on the aarch64 virt board, launch an application that declares an icon-bar presence, choose a row of the menu it declared from its bar slot, and take that slot's declared default action"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The vertical's shared interaction contract (src/lib.rs): the application
# whose bar is driven and how many windows the whole script makes it open —
# read by both the freestanding PASS gate and the host runner's script.
# `no_std` consts only, host-buildable.
[lib]
path = "src/lib.rs"

[[bin]]
name = "tairix-test-appbar-qemu-aarch64"
path = "src/main.rs"

# Freestanding "boot the production aarch64 desktop, launch an application
# that declares an icon bar, and drive the menu it declared" integration
# test. It runs the entire production boot pipeline through `tairix-kernel`'s
# library half (`boot_aarch64::boot`) — bootstrap-floor virtio-MMIO
# discovery, the unlock kthread, driver autoload, the display service, and
# the desktop session — and only swaps the sinks for the PASS witnesses.
# Keeping the QEMU-exit shortcut in a dedicated bin (not a Cargo feature on a
# production crate) prevents feature unification from leaking it into any
# production build.
[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
# The load gate's audit vocabulary: the `APP_LOADED` event id whose `bundle`
# field names the loaded bundle — the launch witness.
tairix-appload = { path = "../../../lib/appload", version = "=0.0.0" }
# The system application store / bundle suffix spellings the launch witness is
# composed from.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The bundle-name reading every guest sink shares.
tairix-itest-witness = { path = "../witness", version = "=0.0.0" }
# The desktop's record of a window on screen.
tairix-itest-desktop-witness = { path = "../desktop_witness", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
