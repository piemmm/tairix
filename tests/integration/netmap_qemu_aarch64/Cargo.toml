[package]
name = "tairix-test-netmap-qemu-aarch64"
description = "plans/NETMAP.md NM2c QEMU integration test: boot the graphical desktop on the aarch64 virt board with a router-advertising network peer, launch the `netmap` map from the program library, and hold the run to the map drawing its interface, subnet and gateway tiers on screen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The vertical's shared contract (src/lib.rs): the bundle the guest attributes
# the launch and exit to — read by both the freestanding PASS gate and the host
# runner's script, so the gesture the host injects and the witness the guest
# latches can never drift apart. `no_std` consts only, host-buildable.
[lib]
path = "src/lib.rs"

[[bin]]
name = "tairix-test-netmap-qemu-aarch64"
path = "src/main.rs"

# The `abi-v1` syscall table (for the audited *name* of the exit syscall and
# the window-endpoint / create-reply spellings) and the application-store
# spelling the launch witness is composed from. Host-buildable.
[dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }

# Freestanding "boot the production aarch64 desktop, launch `netmap`, and watch
# it draw" integration test. It runs the whole production boot pipeline through
# `tairix-kernel`'s library half (`boot_aarch64::boot`) and only swaps the
# audit sink for the PASS witnesses.
[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
# The syscall audit vocabulary: the `SyscallInvoked` event id whose `sc` and
# `comm` fields attribute the map's clean exit to it.
tairix-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
# The kernel/ipc audit vocabulary: the `CallReplied` event id whose `endpoint`
# field attributes a served reply to the window channel (the window witness).
tairix-kernel-ipc = { path = "../../../kernel/ipc", version = "=0.0.0" }
# The load gate's audit vocabulary: the `APP_LOADED` event id whose `bundle` field
# names the loaded bundle — the launch witness.
tairix-appload = { path = "../../../lib/appload", version = "=0.0.0" }
# The bundle-name reading every guest sink shares.
tairix-itest-witness = { path = "../witness", version = "=0.0.0" }
# `format_hex_u64` — the same renderer the kernel/ipc audit fields use, so the
# endpoint witness compares the exact on-wire spelling.
tairix-util = { path = "../../../lib/util", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
