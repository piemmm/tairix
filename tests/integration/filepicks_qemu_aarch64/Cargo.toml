[package]
name = "tairix-test-filepicks-qemu-aarch64"
description = "plans/APPWIN.md AW5 QEMU integration test: boot the graphical desktop on the aarch64 virt board, launch the `view` viewer from the program library and launch it from there twice more, so two of its windows each have a trusted picker up at once, choose the planted picture in each, and hold the run to two one-shot delegations from the session into the one viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The vertical's shared contract (src/lib.rs): the principals and syscalls a
# pick concludes through and how many pickers the script holds up at once,
# read by both the freestanding PASS gate and the host runner's pointer
# script, so the gestures the host injects and the witnesses the guest latches
# can never drift apart. `no_std` consts only, host-buildable.
[lib]
path = "src/lib.rs"

# Every principal and syscall name is the picker-delegation vertical's own,
# read rather than restated; the ABI's bound on the picks one application may
# have open is what the contract's count is checked against.
[dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-test-filepick-qemu-aarch64 = { path = "../filepick_qemu_aarch64", version = "=0.0.0" }

[[bin]]
name = "tairix-test-filepicks-qemu-aarch64"
path = "src/main.rs"

# Freestanding: the production aarch64 boot pipeline through `tairix-kernel`'s
# library half, unchanged, with only the audit sink swapped for the PASS
# witnesses. Keeping the QEMU-exit shortcut in a dedicated bin (not a Cargo
# feature on a production crate) prevents feature unification from leaking it
# into any production build.
[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
# The syscall audit vocabulary: the `SyscallInvoked` event id whose `sc`,
# `comm` and `task` fields attribute a dispatched syscall to the process, and
# the thread of control, that made it.
tairix-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
# The ordered syscall chain and progress marker every guest sink shares.
tairix-itest-witness = { path = "../witness", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
