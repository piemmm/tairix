[package]
name = "tairix-test-el2-entry-qemu-aarch64"
description = "QEMU integration test: an aarch64 board whose CPUs implement EL2 enters the kernel there, as the Raspberry Pi firmware does, and the trampoline hands the boot CPU to EL1 holding every PMU event counter the core implements."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Freestanding kernel ELF QEMU loads with `-kernel` on a `virt` board built
# with `virtualization=on`, so it is entered at EL2. It links the port alone:
# the subject is the trampoline's EL2 hand-off, before anything behind it.
#
# On the host target the crate has no test source and contributes nothing to
# `cargo test`; the orchestrator is `cargo xtask test --qemu`.

[[bin]]
name = "tairix-test-el2-entry-qemu-aarch64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-itest-finisher = { path = "../finisher", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
