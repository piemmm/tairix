[package]
name = "tairix-test-gpucheck-shader-qemu-x86-64"
description = "plans/GPU.md GP8 / MG3 QEMU vertical: boot the production x86_64 tairix-kernel pipeline on a board whose GPU takes Venus work, its driver serving it, against the root image carrying the shadercheck fixture and the kernels it hands `gpucheck --shader`; pass once the scripted shell has run it and every kernel was answered as it must be."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-gpucheck-shader-qemu-x86-64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
tairix-arch-x86_64 = { path = "../../../kernel/arch/x86_64", version = "=0.0.0", features = ["sched-arch"] }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
tairix-itest-witness = { path = "../witness", version = "=0.0.0" }
tairix-test-shadercheck = { path = "../shadercheck_program", version = "=0.0.0", default-features = false }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
