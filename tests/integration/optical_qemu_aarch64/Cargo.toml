[package]
name = "tairix-test-optical-qemu-aarch64"
description = "plans/DEVICES.md USB optical vertical: boot the production aarch64 tairix-kernel pipeline against a root disk carrying the xHCI, USB mass-storage and volume-manager drivers and the test-only optical fixture, with a USB optical drive holding a RISC OS disc, and assert the disc mounts and copies onto ARXFS with every file's bytes and RISC OS filetype."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-optical-qemu-aarch64"
path = "src/main.rs"

# Freestanding: the production aarch64 boot pipeline through `tairix-kernel`'s
# library half, unchanged, with an audit-stream observer that ends the run once
# the fixture and then the scripted shell have exited.
[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
# The audit-record reading every guest sink shares.
tairix-itest-witness = { path = "../witness", version = "=0.0.0" }
tairix-test-optical = { path = "../optical_program", version = "=0.0.0", default-features = false }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
