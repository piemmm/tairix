[package]
name = "tairix-test-optical"
description = "plans/DEVICES.md optical fixture: the `optical` command app the USB optical QEMU vertical plants on its disk and runs from the scripted root shell. It waits for the RISC OS disc's volume, copies it onto ARXFS with the real `cp`, and checks that every file kept its bytes and its RISC OS filetype on the disc and in the copy; on failure it parks, so the run fails loudly by timeout. Never planted on a production image."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime is an optional, on-by-default
# feature, so the host test build of the check library never pulls the
# runtime's `_start`, allocator or panic handler.
[features]
default = ["program"]
program = ["dep:tairix-rt"]

[[bin]]
name = "tairix-test-optical-run"
path = "src/run.rs"

[dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# What each file of the disc must read back as.
tairix-test-iso9660-image = { path = "../iso9660_image", version = "=0.0.0" }

[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }

[build-dependencies]
tairix-buildcfg = { path = "../../../lib/buildcfg", version = "=0.0.0", features = ["std"] }
