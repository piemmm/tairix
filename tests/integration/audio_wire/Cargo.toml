[package]
name = "tairix-test-audio-wire"
description = "Shared fixture for the end-to-end QEMU audio verticals: the device geometry both ends agree on, the deterministic PCM signal the guest plays, and the host-side WAV reader that checks the emulated sound card wrote exactly it. One source of truth, so the guest and the assertion cannot drift."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# The signal as the FLAC file the `play` verticals plant, written by
# `lib/sound`'s encoder: for the image build and the player's host tests,
# never for a guest fixture, which carries no encoder.
flac = ["dep:tairix-sound"]

[dependencies]
tairix-sound = { path = "../../../lib/sound", version = "=0.0.0", features = ["encode"], optional = true }
