[package]
name = "tairix-test-netstack-icmp-qemu-aarch64"
description = "The ICMP echo tools QEMU vertical (plans/NETWORK.md N8b-2b-β, plans/NETMAP.md NM-S3): boot the production aarch64 pipeline with the net-tool disk and the harness-side echo peer, run `ping -c 3 fe80::2` and then `traceroute -n fe80::2` from the scripted shell, and PASS once both tools have exited and the shell's scripted exit — typed only after the trace printed the peer's hop — follows; the peer must also report a served echo and an answer as each of its two routers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-netstack-icmp-qemu-aarch64"
path = "src/main.rs"

# Freestanding "boot the production aarch64 pipeline with the planted
# encrypted-root disk carrying the virtio-net driver + the standard app store
# (with the real `ping` and `traceroute` bundles) and prove the ICMP echo
# tools end to end over the live two-process network" integration test. It reuses the entire
# production boot pipeline through `tairix-kernel`'s library half — discovery,
# the unlock kthread, PID 1 supervision, netstack, devmgr's driver autoload,
# login's spawn-as-user, the shell, and the disk-backed bundle spawn path —
# and only swaps the audit sink (no duplication). Keeping the QEMU-exit
# shortcut in a dedicated bin (not a Cargo feature on a production crate)
# prevents feature unification from leaking it into any production build
# (fail closed).
[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
# The audit-record reading every guest sink shares.
tairix-itest-witness = { path = "../witness", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
