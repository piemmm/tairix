[package]
name = "tairix-test-timed-switch-qemu-aarch64"
description = "plans/TIMESYNC.md TS-6 QEMU integration test: boot the production aarch64 tairix-kernel pipeline on the virt board against the time-net-root disk (a planted system.conf naming the host peer as the one time server) with the harness-side NTP-server peer, then switch network time off and on again from the shell with configure. Proves timed follows the machine configuration while it runs: the clock is set from the peer only after the service recorded network time off, when its ladder is spent and the configuration watch is the one path left that can switch it back on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-timed-switch-qemu-aarch64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
# The witness's two records — the service's network-time change and its clock
# set — by the service's own event ids, and the peer's instant, so none can
# drift from what the guest and the peer emit.
tairix-timesync = { path = "../../../lib/timesync", version = "=0.0.0" }
tairix-test-netstack-wire = { path = "../netstack_wire", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
