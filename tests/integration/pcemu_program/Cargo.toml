[package]
name = "tairix-test-pcemu"
description = "plans/PCEMU.md PC21 fixture: the `pcemucheck` command app the PCEmulator QEMU verticals plant on their disk and run from the scripted root shell. It checks the emulator's reference run against the digest every target asserts, then boots the default machine in its sandboxed worker with a compiler sandbox installing translated code into it, runs a summing loop from a diskette at DOS's prompt, and checks the sum it prints and that the worker ran translated blocks natively; on failure it parks, so the run fails loudly by timeout. Never planted on a production image."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime is an optional, on-by-default
# feature, so the host test build of the check library never pulls the
# runtime's `_start`, allocator or panic handler. The verticals and xtask take
# the library with no features: the command word and the pass marker, without
# the emulator.
[features]
default = ["program"]
checks = ["dep:tairix-fat", "dep:tairix-pcemu"]
program = [
    "checks",
    "dep:tairix-abi",
    "dep:tairix-codegen",
    "dep:tairix-hash",
    "dep:tairix-procinfo",
    "dep:tairix-rt",
    "dep:tairix-sandbox",
]

[[bin]]
name = "tairix-test-pcemu-run"
path = "src/run.rs"

[dependencies]
# The machine, its reference run, the session's host and the sandbox roles
# the program plays, exactly as PCEmulator.app has them.
tairix-pcemu = { path = "../../../userland/apps/pcemu", version = "=0.0.0", optional = true }
# The stamp the diskette's entry carries.
tairix-fat = { path = "../../../lib/fat", version = "=0.0.0", optional = true }

[target.'cfg(target_os = "none")'.dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0", optional = true }
tairix-codegen = { path = "../../../lib/codegen", version = "=0.0.0", optional = true }
tairix-hash = { path = "../../../lib/hash", version = "=0.0.0", optional = true }
tairix-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0", features = ["program"], optional = true }
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
tairix-sandbox = { path = "../../../lib/sandbox", version = "=0.0.0", features = ["program"], optional = true }

[build-dependencies]
tairix-buildcfg = { path = "../../../lib/buildcfg", version = "=0.0.0", features = ["std"] }
