[package]
name = "tairix-test-fp-isolation-qemu-x86-64"
description = "x86_64 floating-point isolation vertical (plans/OPEN-DEFECTS.md D359/D360/D362): two hardware-isolated ring-3 tasks fill the whole SSE/x87 register file and MXCSR with different patterns and timeshare one CPU, and neither may see the other; a third task from the entry-hygiene fixture proves first entry to user mode leaks no kernel register state; and the kernel does floating point in the dispatch loop under a probe task's hostile MXCSR (round-toward-zero, an unmasked exception) and must round to nearest and take no #XM. The build script compiles the two fixtures PIE and converts them to rxe blobs; the kernel boots the production tairix-kernel pipeline."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["test-hooks"]
test-hooks = []

[[bin]]
name = "tairix-test-fp-isolation-qemu-x86-64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-arch-x86_64 = { path = "../../../kernel/arch/x86_64", version = "=0.0.0", features = ["sched-arch"] }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-kernel-mem = { path = "../../../kernel/mem", version = "=0.0.0" }
tairix-kernel-sched-eevdf = { path = "../../../kernel/sched/eevdf", version = "=0.0.0" }
tairix-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
tairix-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
