[package]
name = "tairix-test-threads-qemu-aarch64"
description = "plans/THREADS.md T3b-u QEMU integration test (docs/src/architecture/threads.md): prove lightweight threads end to end on the aarch64 virt board. The parent role of the tests/integration/threads_program fixture spawns and reaps each child role (counter, rendezvous, tls, exitearly, parallel, groupexit) through the production spawn and wait syscalls over the production dispatch hook; PASS only on a parent exit of 0."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# This bin is the SP11c demand-grown stack vertical: the proving `-M virt`
# slice of the fault-driven stack growth, the settable `StackBytes` bound,
# and the below-span guard page, composed from the production
# `KernelDispatchHook` + `KernelSyscallHandlers` fault path rather than a
# bespoke dispatch shim.
#
# The `test-hooks` feature is on by default. Release builds that enable it
# are rejected by the `compile_error!` guard in `src/main.rs` (no hacks; fail
# closed), mirroring the file-map vertical.
[features]
default = ["test-hooks"]
test-hooks = []

[[bin]]
name = "tairix-test-threads-qemu-aarch64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-itest-gic = { path = "../gic_topology", version = "=0.0.0" }
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-caps = { path = "../../../lib/caps", version = "=0.0.0" }
tairix-fdt = { path = "../../../lib/fdt", version = "=0.0.0" }
tairix-itest-finisher = { path = "../finisher", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-kernel-ipc = { path = "../../../kernel/ipc", version = "=0.0.0" }
tairix-kernel-irq = { path = "../../../kernel/irq", version = "=0.0.0" }
tairix-kernel-mem = { path = "../../../kernel/mem", version = "=0.0.0" }
tairix-kernel-sched-api = { path = "../../../kernel/sched/api", version = "=0.0.0" }
tairix-kernel-sched-eevdf = { path = "../../../kernel/sched/eevdf", version = "=0.0.0" }
tairix-kernel-sec = { path = "../../../kernel/sec", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
tairix-sync = { path = "../../../lib/sync", version = "=0.0.0" }

[build-dependencies]
# The shared harness: the target cfg emitter, the `virt` DTB dump helper,
# and the ELF→rxe converter. Host-only build glue.
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
# The build script stamps the kernel's compiled-in syscall CFI tag into the
# converted `rxe` so the production loader admits it.
tairix-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
