# Signed-AppInfo manifest source for the `images` fixture of the disk-image
# QEMU vertical (plans/DISK-IMAGES.md DI7). Composed and planted only on that
# vertical's disk image by tools/xtask: the crate lives outside the userland
# discovery walk, so no production image ships it. CAP_CONSOLE_WRITE for its
# report, CAP_FS_ACCESS to copy the images and read and write the volumes,
# and CAP_PROC_SPAWN to run `mount` and `unmount`; each is intersected with
# the launching user's grants.
id = "os.tairix.test.images"
name = "images"
version = "0.1.0"
kind = "command"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_FS_ACCESS", "CAP_PROC_SPAWN"]
