[package]
name = "tairix-test-images"
description = "plans/DISK-IMAGES.md DI7 fixture: the `images` command app the disk-image QEMU vertical plants on its disk and runs from the scripted root shell. It copies the planted Acorn, Amiga and ISO 9660 images into the user's home, mounts them with the real `mount`, reads them, writes where writable, ejects them with the real `unmount`, and remounts to read back what it wrote; on failure it parks, so the run fails loudly by timeout. Never planted on a production image."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime is an optional, on-by-default
# feature, so the host test build of the check library never pulls the
# runtime's `_start`, allocator or panic handler.
[features]
default = ["program"]
program = ["dep:tairix-rt"]

[[bin]]
name = "tairix-test-images-run"
path = "src/run.rs"

[dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# What the disc image holds.
tairix-test-iso9660-image = { path = "../iso9660_image", version = "=0.0.0" }

[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }

[build-dependencies]
tairix-buildcfg = { path = "../../../lib/buildcfg", version = "=0.0.0", features = ["std"] }
