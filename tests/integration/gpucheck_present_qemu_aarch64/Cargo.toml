[package]
name = "tairix-test-gpucheck-present-qemu-aarch64"
description = "QEMU integration test: boot the graphical desktop on the aarch64 virt board with a virtio GPU its only display, launch `gpucheck --present` from a terminal, and hold its full-screen window, promoted and laid straight into the display's frame, to the scene drawn on the host (plans/GPU.md GP6.5)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The vertical's shared contract (src/lib.rs): the line typed at the shell and
# the commands the guest attributes its witnesses to, read by both the
# freestanding PASS gate and the host runner's script. `no_std` consts only,
# host-buildable.
[lib]
path = "src/lib.rs"

[[bin]]
name = "tairix-test-gpucheck-present-qemu-aarch64"
path = "src/main.rs"

# Freestanding "boot the production aarch64 desktop and show `gpucheck
# --present`" integration test. It runs the entire production boot pipeline
# through `tairix-kernel`'s library half (`boot_aarch64::boot`) and only swaps
# the sinks for the PASS witnesses.
[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
# The load gate's audit vocabulary: the `APP_LOADED` event id whose `bundle`
# field names the loaded bundle — the launch and clean-exit witnesses.
tairix-appload = { path = "../../../lib/appload", version = "=0.0.0" }
# The command store's spelling the bundle paths are composed from.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
# The audit-record reading every guest sink shares.
tairix-itest-witness = { path = "../witness", version = "=0.0.0" }
# The desktop's record of a window on screen.
tairix-itest-desktop-witness = { path = "../desktop_witness", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
