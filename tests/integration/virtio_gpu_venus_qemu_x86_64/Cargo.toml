[package]
name = "tairix-test-virtio-gpu-venus-qemu-x86-64"
description = "plans/GPU.md GP5.2, GP5.3 and GP11.3 QEMU verticals: boot the production x86_64 pipeline on a q35 board whose only display is QEMU's Venus GPU over Mesa's software Vulkan driver, with the Venus check bound in the display driver's place, and prove contexts, host blobs and their mappings are made and let go against the device and a blob's second mapping reads what its first wrote; then that the kernel serves the GPU's channel on a board with no DMA translation unit and behind a VT-d unit translating the GPU, and refuses it, audited, where a declared unit translates no PCI function."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-virtio-gpu-venus-qemu-x86-64"
path = "src/main.rs"

# Behind a VT-d unit translating the GPU, which is served (src/vtd.rs).
[[bin]]
name = "tairix-test-virtio-gpu-venus-vtd-qemu-x86-64"
path = "src/vtd.rs"

# A declared virtio-iommu the PCI host bypasses, so the GPU's channel is
# refused (src/unconfined.rs).
[[bin]]
name = "tairix-test-virtio-gpu-venus-unconfined-qemu-x86-64"
path = "src/unconfined.rs"

# Freestanding: the production x86_64 boot pipeline through `tairix-kernel`'s
# library half, unchanged, with an observer of the audit and diagnostic streams
# that ends the run on the Venus check's verdict.
[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
tairix-arch-x86_64 = { path = "../../../kernel/arch/x86_64", version = "=0.0.0", features = ["sched-arch"] }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
# The kernel's audit vocabulary: the GPU channel refusal the unconfined
# vertical keys on.
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
tairix-test-venus-check = { path = "../venus_check_program", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
