[package]
name = "tairix-test-touch-qemu-aarch64"
description = "plans/POINTING.md PO9 QEMU integration test: boot the graphical desktop on the aarch64 virt board with a virtio multitouch touchscreen as its only pointing device, and launch the terminal from the program library with two taps — the Library button, then the terminal's row — proving touch end to end from the device through its driver, the seat and the session's gesture recogniser to the icon bar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-touch-qemu-aarch64"
path = "src/main.rs"

# The production boot pipeline with only the audit sink swapped, in a
# dedicated bin so the QEMU-exit shortcut never reaches a production build.
[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
# The `InputDelivered` witness and the `kind` its touch delivery carries.
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
# The `APP_LOADED` event id: the launch witness.
tairix-appload = { path = "../../../lib/appload", version = "=0.0.0" }
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-itest-witness = { path = "../witness", version = "=0.0.0" }
# The application the shared host-side bar-launch reconstruction launches.
tairix-test-appbar-qemu-aarch64 = { path = "../appbar_qemu_aarch64", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
