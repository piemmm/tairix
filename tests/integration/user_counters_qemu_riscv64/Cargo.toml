[package]
name = "tairix-test-user-counters-qemu-riscv64"
description = "QEMU integration test: a riscv64 hart the kernel arms gives U-mode none of its counters: arming the hart closes scounteren whatever reset left in it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Freestanding kernel ELF QEMU boots on the riscv64 `virt` board through OpenSBI. It links the port alone:
# the subject is the port's per-CPU hold, which QEMU's benign resets never
# have to close anything for, so the run opens the controls itself.
#
# On the host target the crate has no test source and contributes nothing to
# `cargo test`; the orchestrator is `cargo xtask test --qemu`.

[[bin]]
name = "tairix-test-user-counters-qemu-riscv64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
tairix-arch-riscv64 = { path = "../../../kernel/arch/riscv64", version = "=0.0.0" }
tairix-itest-finisher = { path = "../finisher", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
