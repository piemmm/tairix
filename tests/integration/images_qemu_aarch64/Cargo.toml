[package]
name = "tairix-test-images-qemu-aarch64"
description = "plans/DISK-IMAGES.md DI7 vertical: boot the production aarch64 tairix-kernel pipeline against a root disk carrying the AmigaDOS, ADFS and ISO 9660 drivers and the test-only images fixture, with Acorn, Amiga and ISO 9660 disk images planted in the user's home, and assert each mounts with `mount`, reads, takes a write where writable, ejects with `unmount`, and keeps what was written."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-images-qemu-aarch64"
path = "src/main.rs"

# Freestanding: the production aarch64 boot pipeline through `tairix-kernel`'s
# library half, unchanged, with an audit-stream observer that ends the run once
# the fixture and then the scripted shell have exited.
[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
# The audit-record reading every guest sink shares.
tairix-itest-witness = { path = "../witness", version = "=0.0.0" }
tairix-test-images = { path = "../images_program", version = "=0.0.0", default-features = false }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
