[package]
name = "tairix-test-msi-isolation-qemu-riscv64"
description = "plans/IOMMU.md IOM18.4 QEMU integration test: on an AIA virt board behind the RISC-V IOMMU, a device's MSI lands in its own memory-resident interrupt file, so one naming another device's notice raises nothing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-msi-isolation-qemu-riscv64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-arch-riscv64 = { path = "../../../kernel/arch/riscv64", version = "=0.0.0" }
tairix-fdt = { path = "../../../lib/fdt", version = "=0.0.0" }
tairix-itest-finisher = { path = "../finisher", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-kernel-iommu-api = { path = "../../../kernel/iommu/api", version = "=0.0.0" }
tairix-kernel-iommu-riscv = { path = "../../../kernel/iommu/riscv", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
tairix-pci = { path = "../../../lib/pci", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
