[package]
name = "tairix-theme"
description = "TAIRiX shared desktop theme definition: the runtime-switchable dark/light palettes, corner-radius metrics, fonts, and cursors that drive the window manager, taskbar, and default apps from one place (PLAN.md Stage 7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The two vocabularies a theme shares with an ABI surface, imported rather
# than restated so the value a theme carries and the value on the wire cannot
# drift apart: the font weight the font service rasterises at
# (`tairix_abi::font_ipc::FontWeight`), which a theme names for each text
# role, and the light/dark `Appearance` (`tairix_abi::desktop::Appearance`),
# which the window channel reports to every application.
# It also carries the two bounds a cursor set's name is held to, since that
# name travels the window channel to a chooser.
tairix-abi = { path = "../abi", version = "=0.0.0" }
# The allocation-free bounded string a `CursorSetId` holds its name in: the
# compositor compares its cursor-cache epoch on every pointer refresh, so a
# heap-owned name would put an allocation on that path.
tairix-inline = { path = "../inline", version = "=0.0.0" }
# The one leaf-name spelling check, so the name a cursor set may carry is
# judged by the same parser that judges every other directory name rather
# than by a second ad-hoc rule.
tairix-path = { path = "../path", version = "=0.0.0" }
# The colour every palette role is authored in.
tairix-colour = { path = "../colour", version = "=0.0.0" }

[dev-dependencies]
# The WCAG contrast measure the palette tests hold each role to.
tairix-colour = { path = "../colour", version = "=0.0.0", features = ["test-util"] }

# Everything here is pure theme *data*: the compositing colour algebra lives
# in `lib/raster` and the colour itself in `lib/colour`, and the crate stays
# at the bottom of the layering — depended on, never depending on a kernel,
# driver, or userland crate.
