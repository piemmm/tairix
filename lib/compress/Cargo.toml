[package]
name = "tairix-compress"
description = "First-party TAIRiX LZ (zstd-fast-style) compression codec, plus the codecs foreign formats need — RFC 1951/1950 DEFLATE and zlib, bzip2, and the ARC family's methods — with no external compression dependency (arxfs-spec §3, §10)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# No external dependency on purpose. The compression codec is first-party
# (roll our own; this is *not* the crypto carve-out):
# ARXFS must have no external zstd/compression dependency
# (`docs/src/filesystem/arxfs-spec.md` §3, §17). The crate is `no_std` and
# allocation-free; it compresses and decompresses through caller-provided
# slices so it fits the kernel/driver stack-buffer style with no heap. The
# DEFLATE/zlib streams a foreign format needs are the same discipline: the
# state a stream carries is a value the caller owns and places.
[dependencies]
# The CRC-32 a gzip member's trailer holds its data to.
tairix-crc32 = { path = "../crc32", version = "=0.0.0" }

[dev-dependencies]
# The fuzz harness draws its inputs through the shared seed/budget
# seam (`tairix_fuzzseed`): one place picks the per-run seed, logs it at
# the start of the test, and bounds the smoke/soak loop. Test scaffolding only;
# never in a TAIRiX build.
tairix-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0" }
