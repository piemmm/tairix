[package]
name = "tairix-fscopy"
description = "TAIRiX shared file copy engine: a file's bytes copied with its holes (GNU `cp --sparse` semantics over the hole-aware seek), its extended attributes carried as the destination can keep them, and one report of what it could not. The one copy every copying tool — cp, mv, fstree, the file manager — runs, so none carries a private loop. no_std + alloc, forbids unsafe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The seams over the running system's files are `tairix_rt::copy`, so the
# engine depends on the ABI alone and the runtime can run it too.
[dependencies]
tairix-abi = { path = "../abi", version = "=0.0.0" }
tairix-fsmeta = { path = "../fsmeta", version = "=0.0.0" }
