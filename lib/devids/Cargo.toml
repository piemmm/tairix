[package]
name = "tairix-devids"
description = "TAIRiX hardware-identity database engine (`lib/devids`): the one definition of the vetted pci.ids/usb.ids/oui.ids snapshot grammar, the strict fail-closed vetting filter, the compact sorted lookup-table encoder, the allocation-free binary-search decoder, and the bounded loader the `lspci`/`lsusb` command apps and the network map read their bundled `Resources/*.ids.bin` tables through (plans/DEVICES.md DEVICE1, plans/NETMAP.md NM-F)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The snapshot text parser, vetting filter, and table encoder need `alloc`;
# the binary-table decoder and lookups do not. A lookup-only consumer (a
# command app rendering names) builds with `default-features = false`; the
# `cargo xtask devids` generator and this crate's own tests use the default.
default = ["textdb"]
textdb = ["dep:tairix-util"]
# The loader a freestanding `Run` binary reads its bundled table through, so
# no consumer carries a private copy of the path or the bound. Enabled only by
# a `Run` binary's target-gated dependency.
rt = ["dep:tairix-abi", "dep:tairix-cmdres", "dep:tairix-rt"]

[dependencies]
# The one rule for which characters hide or reorder text, so the vetting
# filter refuses exactly what every display would have to escape.
tairix-util = { path = "../util", version = "=0.0.0", optional = true }
# For the `rt` loader only: the bundle-entry and `Errno` vocabulary
# (`tairix-abi`), the one bundle-resolution policy the program's own help
# uses too (`tairix-cmdres`), and the `fs_*` file wrappers (`tairix-rt`).
tairix-abi = { path = "../abi", version = "=0.0.0", optional = true }
tairix-cmdres = { path = "../cmdres", version = "=0.0.0", optional = true }
tairix-rt = { path = "../rt", version = "=0.0.0", optional = true }

[dev-dependencies]
# The in-tree fuzz harness draws its inputs through the shared seed/budget
# seam: one place picks the per-run seed, logs it at the start of the test,
# and bounds the smoke/soak loop. Test scaffolding only; never in a TAIRiX
# build.
tairix-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0" }
