[package]
name = "tairix-fsprobe"
description = "TAIRiX filesystem recognition: the one no_std definition of which supported filesystem a block extent holds (a RAID member, ARXFS, ext4, FAT32, ISO 9660, UDF, ADFS), which stable identity, label and mutation evidence it carries, and how that identity renders as a short display fingerprint (plans/DEVICES.md D3c, plans/ALIAS.md §3.8)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The closed set of attachable filesystem types (`tairix_abi::volume`), so a
# probe result names exactly what a `volume_attach` request can carry.
tairix-abi = { path = "../abi", version = "=0.0.0" }
# The byte-addressed reader a probe reads an extent through, wherever in it
# a format's structures lie.
tairix-bytedev = { path = "../bytedev", version = "=0.0.0" }
# SHA-256, the stable digest a content-derived identity is taken from for a
# format that records no unique identifier.
tairix-crypto = { path = "../crypto", version = "=0.0.0" }
# The shared RAID on-disk metadata definition (`tairix_raidmeta`), so the probe
# recognises a RAID array member through the same fail-closed superblock decode
# the RAID composition driver assembles from — one definition, never a second
# copy of the format. This lets the volume manager refuse to
# mount a bare, un-assembled array member as a standalone filesystem.
tairix-raidmeta = { path = "../raidmeta", version = "=0.0.0" }
# Fallible allocation, so a refused buffer is an error rather than an abort.
tairix-util = { path = "../util", version = "=0.0.0" }
# The storage resolvers and the resource namespaces, which the naming policy
# publishes no volume under bare.
tairix-path = { path = "../path", version = "=0.0.0" }
tairix-resref = { path = "../resref", version = "=0.0.0" }

[dev-dependencies]
# Per-run PRNG seeding + wall-clock budget for the fuzz harness
# (`tests/fuzz_fsprobe.rs`).
tairix-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0" }
# The ISO 9660 records and descriptors the probe's test images are made of.
tairix-test-iso9660-image = { path = "../../tests/integration/iso9660_image", version = "=0.0.0" }
