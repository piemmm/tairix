[package]
name = "tairix-raytrace"
description = "TAIRiX ray tracer: scenes composed at random from a seed (still lifes, architecture, and landscapes of terrain, sea, trees, grass and cloud), traced a pixel at a time by distributed ray tracing with adaptive, stratified sampling, for the Ray Tracer screensaver bundle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The long host tests that compose or prepare a whole scene. Their cost grows
# with every detail a scene gains, so `ci-long` and `cargo xtask test --scenes`
# run them and `ci` only lints them.
scene-tests = []

[dependencies]
# `mathf`, the one first-party float maths every target rounds identically,
# `space`, the vectors, frames and poses a scene is traced in, and the
# fallible allocation helpers.
tairix-util = { path = "../util", version = "=0.0.0" }
# The predictable generator a scene is composed from.
tairix-rng = { path = "../rng", version = "=0.0.0" }
# The premultiplied pixel a traced pixel becomes, and the desktop's ordered
# dither it is encoded through.
tairix-raster = { path = "../raster", version = "=0.0.0" }
# The sRGB transfer a scene's colours and a traced radiance are encoded through.
tairix-colour = { path = "../colour", version = "=0.0.0" }
# Water's work on a land: drainage, incision, creep and slumping, droplet
# erosion, and the router a road finds its way by.
tairix-terrain = { path = "../terrain", version = "=0.0.0" }
# The countryside a farmed land is laid out in: its holdings, the ways between
# its farms and villages, its fields, their boundaries and gates, and the
# farmsteads' yards.
tairix-countryside = { path = "../countryside", version = "=0.0.0" }
# The one rule a wood's places are spaced by, shared with the countryside's
# villages and WinterSun's scatter: run in rounds, a place stands once no
# outranking one still undecided crowds it, and yields to any that stands.
tairix-scatter = { path = "../scatter", version = "=0.0.0" }
# The runner a scene's grids are prepared across, so a caller holding the
# desktop's pool fills them on every core.
tairix-parallel = { path = "../parallel", version = "=0.0.0", default-features = false }
# The fallible hash map the caustics' survey keeps each tile it asks for in,
# and the hash it is built over.
tairix-collections = { path = "../collections", version = "=0.0.0" }
tairix-hash = { path = "../hash", version = "=0.0.0" }
# The integer finalisers its draws, streams and lattice hashes are keyed by.
tairix-mix = { path = "../mix", version = "=0.0.0" }
# The procedural noise every pattern and landform is drawn from.
tairix-noise = { path = "../noise", version = "=0.0.0" }
# The land generator its landscapes are built by.
tairix-land = { path = "../land", version = "=0.0.0" }

[dev-dependencies]
# The host test runners: `Threaded`, so the tests prove a draft's grids fill
# the same whether their bands run on one thread or on several at once.
tairix-parallel = { path = "../parallel", version = "=0.0.0", default-features = false, features = ["test-util"] }
