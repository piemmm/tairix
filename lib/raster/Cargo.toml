[package]
name = "tairix-raster"
description = "TAIRiX shared software rasterisation primitives: premultiplied-alpha colours, the Porter–Duff over operator, and a pixel surface, used by the window manager and the taskbar without either depending on the other (PLAN.md Stage 7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The `JobRunner` contract a frost's independent pieces are handed through.
# `default-features = false` takes the contract and the serial runner alone: this
# crate creates no thread and must stay linkable where there is none.
tairix-parallel = { path = "../parallel", version = "=0.0.0", default-features = false }
# The colour value a theme authors and a settings document stores: it meets
# the compositing arithmetic at exactly one edge — `From<Rgba> for Color` — so
# every surface turns an authored colour into a renderable one the same way.
tairix-colour = { path = "../colour", version = "=0.0.0" }
# `Surface` is one of the two rendered forms the window manager's and the
# taskbar's bounded rasterisation caches hold (`plans/SMARTRAM.md` section
# 6.4); its `CachedBytes` impl belongs here, not duplicated into both GUI
# crates.
tairix-reclaim = { path = "../reclaim", version = "=0.0.0" }
# `mathf`: the workspace's bounded `no_std` float maths, for the sine, cosine,
# tangent and square root the affine transform and a gradient's focal ray need.
# Taking them from here keeps an external libm out of the trusted computing base
# and means this crate rotates and scales identically to the glyph rasteriser
# and the SVG decoder. `fallible`: the one shared reservation every buffer
# sized by image geometry takes, so a surface a machine short of memory
# refuses is a `None` and not an allocation abort. `secret`: the volatile
# erase a reclaimed surface's pixels are overwritten through.
tairix-util = { path = "../util", version = "=0.0.0" }
# The fixed arrays an outline is traced into, so the shape path touches no
# allocator and a generator cannot exceed a buffer it was sized against.
tairix-inline = { path = "../inline", version = "=0.0.0" }
# The capability-gated selection the per-pixel kernels' vector candidates are
# chosen and self-verified through, resolved on first use against the feature
# set this process was delivered. `default-features = false`: selection only,
# no heap-backed tables.
tairix-cpuops = { path = "../cpuops", version = "=0.0.0", default-features = false }
# The one fast hash the kernels' conformance digest is folded with, taken only
# by the checks that hold a target's candidates to it.
tairix-hash = { path = "../hash", version = "=0.0.0", optional = true }

[features]
# The kernels' conformance digest (`accel::conformance_digest`), for the checks
# that hold a target's candidates to it; nothing that draws needs it.
conformance = ["dep:tairix-hash"]
# The half-resolution blur spelled as its definition (`halved_reference`), for
# the tests that hold a frost to it; nothing that draws needs it.
test-util = []

[build-dependencies]
# The one reading of which vector unit the target carries, shared by every
# crate with packed candidates.
tairix-buildcfg = { path = "../buildcfg", version = "=0.0.0", features = ["std"] }

[dev-dependencies]
# The shared order-shuffling runner the frost's bit-identity tests compose
# against, so this crate keeps no private copy of it.
tairix-parallel = { path = "../parallel", version = "=0.0.0", default-features = false, features = [
    "test-util",
] }
# The shared seeded generator the differential sweeps draw random content from
# (never in a shipping build).
tairix-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0" }
# The conformance digest the unit tests hold every candidate to.
tairix-hash = { path = "../hash", version = "=0.0.0" }

[lints]
workspace = true
