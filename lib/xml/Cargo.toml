[package]
name = "tairix-xml"
description = "TAIRiX shared XML element scanner: a fail-closed, first-party no_std reader yielding a document's elements, attributes and character data under fixed size bounds, for the SVG decoder and OpenRaster's layer stack."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]

[lints]
workspace = true

[dev-dependencies]
# The fuzz harness draws its inputs through the shared seed/budget
# seam (`tairix_fuzzseed`). Test scaffolding only; never in a TAIRiX build.
tairix-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0" }
