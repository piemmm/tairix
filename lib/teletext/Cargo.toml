[package]
name = "tairix-teletext"
description = "The Teletext character generator: the SAA5050's alphanumerics and mosaics, character rounding, and a row's serial attributes. no_std, forbids unsafe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The one reading of glyph art the character generator is drawn in. Without
# its default features it is the atlas alone: nothing that draws comes with it.
tairix-font = { path = "../font", version = "=0.0.0", default-features = false }
