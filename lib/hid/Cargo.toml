[package]
name = "tairix-hid"
description = "TAIRiX HID (plans/HID.md): the report-descriptor model, the keyboard, mouse, touchpad and touchscreen decoders, and the device engine every HID class driver runs, whatever its transport. no_std, fail-closed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The seat records the decoders produce and the errors they fail closed with.
tairix-abi = { path = "../abi", version = "=0.0.0" }
# The decoded keyboard `Key` vocabulary the console producer resolves HID
# usages into (a `lib/*` crate).
tairix-input = { path = "../input", version = "=0.0.0" }
# The shared terminal key map that turns each resolved key press into the
# `KeyInput` record a driver injects through `key_inject` — the one definition
# of the `Key`→record map.
tairix-keymap = { path = "../keymap", version = "=0.0.0" }

[dev-dependencies]
# The report fuzz harness draws its inputs through the shared seed/budget
# seam: one place picks the per-run seed, logs it at the start of the test, and
# bounds the smoke/soak loop. Test scaffolding only; never in a TAIRiX build.
tairix-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0" }

[lints]
workspace = true
