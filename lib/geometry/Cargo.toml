[package]
name = "tairix-geometry"
description = "TAIRiX shared integer screen geometry (points and rectangles) for the window manager, taskbar, and graphical apps (PLAN.md Stage 7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The only dependency is the ABI, below it: the UI scale range a desktop
# carries across the boundary is the ABI's, and `Scale` is held to it. The
# compositing colour algebra lives in `lib/raster`; this crate owns only the
# coordinate types the GUI crates share.

[dependencies]
tairix-abi = { path = "../abi", version = "=0.0.0" }

[dev-dependencies]
# The shared seeded generator the randomised unit tests draw from (never in a
# shipping build).
tairix-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0" }
