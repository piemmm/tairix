[package]
name = "tairix-window"
description = "TAIRiX window-channel protocol engine: the one definition of the zero-copy, owner-keyed app-window semantics — the server engine the desktop session composes and the client an application's Run binary links (plans/APPWIN.md AW2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tairix-abi = { path = "../abi", version = "=0.0.0" }
tairix-display = { path = "../display", version = "=0.0.0" }
# Integer screen geometry: the window-local point a delivered pointer event
# carries.
tairix-geometry = { path = "../geometry", version = "=0.0.0" }
# The shared pointer input-event vocabulary every control consumes, so the
# one wire-to-control translation every windowed app needs lives here rather
# than as a private copy per app.
tairix-input = { path = "../input", version = "=0.0.0" }
# The one file-name rule a dropped item's name is held to before the desktop
# is told it lands.
tairix-path = { path = "../path", version = "=0.0.0" }
# The syscalls an application's own half needs: one `shm_create`d, granted
# frame region per window. Optional so the server engine the session composes
# stays free of the runtime.
tairix-rt = { path = "../rt", version = "=0.0.0", optional = true }
# The memory-pressure band the shared app shell puts on every app's wait-set,
# so a cache is trimmed as memory tightens rather than held until something
# else is starved. Optional with the rest of the app-side half.
tairix-procinfo = { path = "../procinfo", version = "=0.0.0", optional = true, features = [
    "program",
] }
# The worker pool an app spreads its per-pixel work across, sized from the CPUs
# the System Information API reports. Optional with the rest of the app half.
tairix-parallel = { path = "../parallel", version = "=0.0.0", optional = true, features = ["pool"] }
# The retained window surface the shell draws each frame into. Optional with
# the rest of the app-side half.
tairix-raster = { path = "../raster", version = "=0.0.0", optional = true }
# The theme a document window's engine is laid out and drawn under, and the
# registry the shell primes from the session's reported appearance.
tairix-theme = { path = "../theme", version = "=0.0.0" }
# The queue a document application's saves are written on, and the spelling
# an untrusted name is stated in.
tairix-util = { path = "../util", version = "=0.0.0" }
# The one rule for a hidden character.
tairix-visible = { path = "../visible", version = "=0.0.0" }
# The settings window a document application's preferences are edited in:
# the shared settings frame, the closed-registry engine it edits, and the
# pictures its sidebar shows. Optional, for the applications that keep
# preferences.
tairix-controls = { path = "../controls", version = "=0.0.0", optional = true }
tairix-appconf = { path = "../appconf", version = "=0.0.0", optional = true }
tairix-icon = { path = "../icon", version = "=0.0.0", optional = true }

[target.'cfg(target_os = "none")'.dependencies]
# The font client a document application's text is drawn through: the host
# has it draw without waiting on the font service, and fetches what it drew
# provisionally on a thread of its own. Optional with the rest of the app
# half, and only where the runtime it fetches through runs.
tairix-font = { path = "../font", version = "=0.0.0", optional = true, features = ["rt"] }

[features]
default = ["rt"]
# The application's own half: the frame region (`WindowFrames`), the shared
# app shell (`app`) and the document host (`docapp`), which call the runtime's
# syscalls. Disable for the engine-only, syscall-free view a host test or the
# server side takes.
rt = [
    "dep:tairix-rt",
    "dep:tairix-procinfo",
    "dep:tairix-parallel",
    "dep:tairix-raster",
    "dep:tairix-font",
]

# The settings window over an application's closed registry
# (`docapp::settings`), which needs none of the runtime.
settings = [
    "dep:tairix-controls",
    "dep:tairix-appconf",
    "dep:tairix-icon",
    "dep:tairix-raster",
]

[lints]
workspace = true

[build-dependencies]
tairix-buildcfg = { path = "../buildcfg", version = "=0.0.0", features = ["std"] }

[dev-dependencies]
# The shared seeded generator the randomised unit tests draw from (never in a
# shipping build).
tairix-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0" }
# The settings window is tested with the rest of the crate.
tairix-window = { path = ".", features = ["settings"] }
