[package]
name = "tairix-fdt"
description = "TAIRiX shared flattened-device-tree (FDT/DTB) reader: the one device-tree parser every architecture port builds its platform discovery on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# `writer` exposes the `write` module, the tree writer a build tool emits a
# blob for firmware with. It pulls `alloc`, so it is off by default: the
# architecture ports link only the allocation-free reader.
# `test-fixtures` exposes the `fixture` module — the trees the architecture
# ports' discovery tests and this crate's own parser tests are built from,
# through the same writer — and is enabled only in the dependent crates'
# [dev-dependencies].
default = []
writer = []
test-fixtures = ["writer"]

[dependencies]

[dev-dependencies]
# The fuzz harness draws its inputs through the shared seed/budget
# seam (`tairix_fuzzseed`): one place picks the per-run seed, logs it at
# the start of the test, and bounds the smoke/soak loop. Test scaffolding only;
# never in a TAIRiX build.
tairix-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0" }
# The fuzz harness (`tests/fuzz_fdt.rs`) drives the parser against
# mutated-but-structured device trees. It builds those templates with the
# crate's own `fixture` DTB builder rather than re-rolling a second builder, so
# the harness needs the `test-fixtures` feature on.
# Depending on the crate itself in `[dev-dependencies]` is the canonical way
# to turn a feature on only for this crate's own tests; it never reaches the
# `default = []` production surface (the `fixture`/`alloc` code stays out of
# the parser that the architecture ports link).
tairix-fdt = { path = ".", features = ["test-fixtures"] }
