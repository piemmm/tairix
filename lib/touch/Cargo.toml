[package]
name = "tairix-touch"
description = "TAIRiX seat touch gesture recogniser (plans/POINTING.md): touch frames to pointer motion, clicks, two-axis scroll and pinch. no_std, allocation-free."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The touch frame the recogniser reads, the pinch vocabulary it answers in, the
# physical button codes a surface's own buttons carry, and the scroll unit.
tairix-abi = { path = "../abi", version = "=0.0.0" }
# The logical button a click made by fingers already is.
tairix-input = { path = "../input", version = "=0.0.0" }

[dev-dependencies]
# The invariant harness draws its frame sequences through the shared seed and
# budget seam. Test scaffolding only; never in a TAIRiX build.
tairix-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0" }

[lints]
workspace = true
