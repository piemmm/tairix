[package]
name = "tairix-spirv"
description = "TAIRiX SPIR-V shader module: the checked model the builder and the GPU backends share; its total and bounded decoder over the grammar generated from the vendored Khronos grammar; its validator — the capability allow-list, logical addressing, typed operands, structured control flow, logical pointers, explicit layout, and each entry point's interface and resource bindings, decided against a pipeline layout — and the encoder back (plans/SHADER.md SH1, SH2). no_std + alloc, forbids unsafe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tairix-util = { path = "../util", version = "=0.0.0" }

[dev-dependencies]
# The shared per-run seed and budget the fuzz harness draws through.
tairix-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0" }
