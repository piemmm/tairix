[package]
name = "tairix-clock"
description = "TAIRiX clock-v1 controller side: the endpoint every clock controller driver serves under its node's duty — the caller's link attested by the kernel, holders tracked per instance, each clock exact or floored as its hardware declares — and the freestanding serve loop around it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The `clock-v1` frames and the link records.
tairix-abi = { path = "../abi", version = "=0.0.0" }
# The supplier seam the endpoint asks the kernel about its callers through.
tairix-drvrt = { path = "../drvrt", version = "=0.0.0" }

[dev-dependencies]
# The fake kernel the endpoint's own tests are answered through.
tairix-drvrt = { path = "../drvrt", version = "=0.0.0", features = ["test-support"] }

[features]
# Exposes `testkit`'s endpoint rig to a clock controller driver's own tests,
# over the one fake kernel every supplier is tested against.
test-support = ["tairix-drvrt/test-support"]

[target.'cfg(target_os = "none")'.dependencies]
# The send capability the endpoint is restricted to.
tairix-caps = { path = "../caps", version = "=0.0.0" }
# Every decision, recorded with a stable event id.
tairix-log = { path = "../log", version = "=0.0.0" }
# The endpoint, the wait set and peer exits.
tairix-rt = { path = "../rt", version = "=0.0.0" }
