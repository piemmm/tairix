[package]
name = "tairix-util"
description = "TAIRiX shared utilities, each used by two or more crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The one definition of time's units: the seconds operand is scaled by its
# nanoseconds-per-second, and the tests count durations in it.
tairix-abi = { path = "../abi", version = "=0.0.0" }
# The one rule for showing text from elsewhere, which `utf8::shown`, `quote`
# and `report` show and escape it by.
tairix-visible = { path = "../visible", version = "=0.0.0" }

[dev-dependencies]
# The metered allocator that refuses a request past a size, so `trim` is held
# to leaving a buffer whole when the copy it moves it into is refused.
tairix-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0" }
