[package]
name = "tairix-smbfs"
description = "TAIRiX network-share service (`plans/SMB.md`): a front holding the sockets, the netshare-v1 endpoint and every authority, and one capability-empty sandboxed worker per server connection running the `tairix-smb` client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`tairix-rt`) is an
# optional, on-by-default build feature, so host tooling builds only the
# library and the host test build never pulls the runtime's `_start`,
# allocator or panic handler.
[features]
default = ["program"]
program = [
    "dep:tairix-rt",
    "dep:tairix-caps",
    "dep:tairix-procinfo",
    "tairix-procinfo/program",
    "tairix-sandbox/program",
    "tairix-resolver/program",
]
# The in-memory world the front's tests and this crate's fuzz harness drive it
# in, over `tairix-smb`'s scripted server.
test-support = ["tairix-smb/test-support"]

# The package is both the `tairix-smbfs` library (the front and the worker,
# host-testable over injected seams) and the `Run` entry-point binary
# installed at `/System/Services/smbfs.app/Run`, which serves as the front or,
# spawned in the sandbox's session-worker role, as a connection's worker.
[[bin]]
name = "tairix-smbfs-run"
path = "src/run.rs"

[dependencies]
# netshare-v1, the network attachment the front offers, the socket events it
# relays, and the attested caller.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The SMB 3 client each worker runs, and the NTLM key the front derives.
tairix-smb = { path = "../../../lib/smb", version = "=0.0.0" }
# The duplex session each worker runs under, its framing and wire cursor.
tairix-sandbox = { path = "../../../lib/sandbox", version = "=0.0.0" }
# The structured audit records the front writes.
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
# The bounded strings a share's name is held in.
tairix-inline = { path = "../../../lib/inline", version = "=0.0.0" }
# The maps a principal's holdings and the mounts are found by, and the
# indexed heap each connection's deadlines are kept in, each insertion
# failing rather than aborting when memory runs out.
tairix-collections = { path = "../../../lib/collections", version = "=0.0.0" }
tairix-hash = { path = "../../../lib/hash", version = "=0.0.0" }
# The digest a share's volume key is derived with.
tairix-crypto = { path = "../../../lib/crypto", version = "=0.0.0" }
# The self-wiping buffer a request's password is decoded in.
tairix-util = { path = "../../../lib/util", version = "=0.0.0" }
# The host-name resolution a request naming no address needs, off the loop.
tairix-resolver = { path = "../../../lib/resolver", version = "=0.0.0" }
# The bounded, pressure-governed cache a held file's clean pages and a node's
# attributes are kept in, and the pinned ledger unwritten bytes are counted in.
tairix-reclaim = { path = "../../../lib/reclaim", version = "=0.0.0" }
# The machine-shared, RAM-derived bound on the bytes written and not yet sent.
tairix-writeback = { path = "../../../lib/writeback", version = "=0.0.0" }

# The `Run` binary's freestanding userland runtime: `_start`, the global
# allocator, the socket, call and wait-set wrappers, the clock, and the
# random syscall. Pulled only for the bare-metal targets the program is built
# for.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
# The capability the netshare endpoint is bound requiring of a sender.
tairix-caps = { path = "../../../lib/caps", version = "=0.0.0", optional = true }
# The machine's memory the caches are a share of, and the memory-pressure
# band they shrink to.
tairix-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0", optional = true }

[dev-dependencies]
# The scripted SMB 3 server the tests drive the workers against.
tairix-smb = { path = "../../../lib/smb", version = "=0.0.0", features = ["test-support"] }
# This crate with its in-memory world, for the fuzz harness.
tairix-smbfs = { path = ".", version = "=0.0.0", default-features = false, features = ["test-support"] }
# The fuzz harness draws its inputs through the shared seed/budget seam.
# Test scaffolding only; never in a TAIRiX build.
tairix-fuzzseed = { path = "../../../tests/fuzzseed", version = "=0.0.0" }

[build-dependencies]
tairix-buildcfg = { path = "../../../lib/buildcfg", version = "=0.0.0", features = ["std"] }
