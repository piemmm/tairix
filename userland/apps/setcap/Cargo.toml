[package]
name = "tairix-setcap"
description = "TAIRiX `setcap` CLI: set or clear a file's required-capability gate (`userland/apps/` — `PLAN.md` Stage 6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# `setcap` sets the per-inode capability gate through an injected
# filesystem seam that speaks the frozen `Errno` and `CapabilityId`, so it
# invents no parallel error set and never links a kernel or driver
# crate.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The `Output` stream the engine writes through.
tairix-util = { path = "../../../lib/util", version = "=0.0.0" }
# The shared tree seam: operands opened through their final link, trees
# walked through the directories held open, never through a link.
tairix-fscopy = { path = "../../../lib/fscopy", version = "=0.0.0" }

[dev-dependencies]
# The shared in-memory tree, with its attacker hook, the engine's tests run
# against.
tairix-fscopy = { path = "../../../lib/fscopy", version = "=0.0.0", features = ["test-support"] }
