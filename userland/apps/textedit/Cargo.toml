[package]
name = "tairix-textedit"
description = "TAIRiX TextEdit: the desktop editor for any file — text with its control bytes shown, a hex view of the same bytes, syntax colouring and live validation of the TAIRiX settings stores — holding no filesystem capability and parsing nothing of its documents itself (plans/TEXTEDIT.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The frozen `Errno`, the window-channel menu vocabulary and the desktop's
# scroll units the engine speaks.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The sandboxed syntax protocol's batch bounds and answer shape, so a batch
# the editor builds is one the seam accepts.
tairix-sandbox = { path = "../../../lib/sandbox", version = "=0.0.0" }
# The shared Reactive Alloy controls the window composes: the find bar's
# fields and buttons, the scrollbars.
tairix-controls = { path = "../../../lib/controls", version = "=0.0.0" }
# Shared text rasterisation: the monospace grid and the status band.
tairix-font = { path = "../../../lib/font", version = "=0.0.0" }
# The shared integer screen geometry the layout and every hit-test use.
tairix-geometry = { path = "../../../lib/geometry", version = "=0.0.0" }
# The shared desktop input vocabulary and the one click-pairing rule.
tairix-input = { path = "../../../lib/input", version = "=0.0.0" }
# Shared software rasterisation: the window picture the view paints.
tairix-raster = { path = "../../../lib/raster", version = "=0.0.0" }
# The one extension registry a document's name is typed by, so the editor
# keeps no second table of file types.
tairix-browse = { path = "../../../lib/browse", version = "=0.0.0" }
# The shared non-cryptographic generator the document's treap draws its
# priorities from.
tairix-rng = { path = "../../../lib/rng", version = "=0.0.0" }
# The format set, the span vocabulary, and store-name detection. The lexers
# themselves run only in the sandbox worker.
tairix-syntax = { path = "../../../lib/syntax", version = "=0.0.0" }
# The syntax roles a span names.
tairix-theme = { path = "../../../lib/theme", version = "=0.0.0" }
# The one width rule a monospace grid measures characters by.
tairix-vt = { path = "../../../lib/vt", version = "=0.0.0" }
# The word-at-a-time line-feed scans the document's line index is built on,
# and the fallible buffers a load and a tally land in.
tairix-util = { path = "../../../lib/util", version = "=0.0.0" }
# The memory-pressure band the undo history is sized for.
tairix-reclaim = { path = "../../../lib/reclaim", version = "=0.0.0" }

# The package is both the host-tested editor engine and the `Run` entry-point
# binary of the on-disk `TextEdit.app` bundle: a freestanding pure-Rust
# program on the native Tier-1 targets and an inert host stub elsewhere.
[[bin]]
name = "tairix-textedit-run"
path = "src/run.rs"

# Everything only the freestanding `Run` binary links.
[target.'cfg(target_os = "none")'.dependencies]
# The app half of the window channel, the shared windowed-app shell and the
# clipboard client.
tairix-window = { path = "../../../lib/window", version = "=0.0.0" }
# The pure-Rust userland runtime: `_start`, the allocator, the file calls
# and the worker desks the document and the sandbox run on.
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }
# The glyph service the grid and the status band are set through.
tairix-font = { path = "../../../lib/font", version = "=0.0.0", features = ["rt"] }
# The bundle's own `Help/` tree, read for the short `-h` surface.
tairix-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
# The sandbox's worker-role side: `serve_stdio`, `worker_role` and the
# launcher that re-enters this binary as its capability-empty parser.
tairix-sandbox = { path = "../../../lib/sandbox", version = "=0.0.0", features = ["program"] }

[dev-dependencies]
# The engine's host tests measure and draw text, so they use the shared solid
# test transport rather than reaching a running `fontd`.
tairix-font = { path = "../../../lib/font", version = "=0.0.0", features = ["test-util"] }
