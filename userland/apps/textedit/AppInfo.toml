# Signed-AppInfo manifest source for TextEdit, the desktop editor
# (plans/TEXTEDIT.md). The build's app-bundle composer cross-compiles Run,
# signs this manifest, and plants the bundle on /System/Applications.
#
# No filesystem capability: every document is one the user handed over — a
# descriptor Files or the desktop opened for it, or a grant from the session's
# trusted picker — and every save writes through that descriptor.
# CAP_CONSOLE_WRITE carries its stderr diagnostics; CAP_SHM the window frame
# region and the clipboard's payload region; CAP_SANDBOX_SPAWN re-enters this
# binary as capability-empty workers, one that colours, detects and checks a
# document, one that lists an executable's code and one that reports a
# picture's structure, each holding nothing beyond its two pipes, since a
# document is untrusted input; CAP_LOG_EMIT
# records a worker being replaced after a crash, which would otherwise be
# refused and lost.
id = "os.tairix.textedit"
name = "TextEdit"
title = "TextEdit"
version = "0.1.0"
kind = "application"
purpose = "Edit any file: text, code, settings or raw bytes"
author = "The TAIRiX Project"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_SHM", "CAP_SANDBOX_SPAWN", "CAP_LOG_EMIT"]
# Every textual type subclasses text/plain, and every file is at last bytes,
# application/octet-stream: the two claims open anything, text as text and the
# rest as hex or code, ranked behind an application that claims a type more
# narrowly.
associations = ["text/plain", "application/octet-stream"]
document-access = "read-write"
library = "Accessories"
library-icon = "TextEdit.png"
