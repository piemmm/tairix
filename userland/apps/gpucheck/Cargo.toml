[package]
name = "tairix-gpucheck"
description = "TAIRiX `gpucheck` CLI: run the same work — transfers, every pass of the pinned set, the image work, the render work, and an indirect dispatch past the device's counts — on each served GPU and on the software device and answer where they differ (`plans/GPU.md` GP11.2, GP5.4–GP5.6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's runtime, its listing of the served GPUs, its short help
# and the window `--present` shows the scene in; a consumer of the work alone
# takes none of them.
[features]
default = ["program"]
program = [
    "dep:tairix-rt",
    "dep:tairix-procinfo",
    "dep:tairix-help",
    "dep:tairix-window",
    "dep:tairix-sandbox",
]

[[bin]]
name = "tairix-gpucheck-run"
path = "src/run.rs"

[dependencies]
# The clock the reference reads its deadlines from, and the work's deadline.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The GPU seam the work runs through: each served device, and the software
# device it is compared with.
tairix-gpu = { path = "../../../lib/gpu", version = "=0.0.0" }
# The runner the software device shares its work across: one thread.
tairix-parallel = { path = "../../../lib/parallel", version = "=0.0.0", default-features = false }
# The pinned set, each pass run on its sample.
tairix-shaders = { path = "../../../lib/shaders", version = "=0.0.0" }
# The passes' modules, admitted to read the layout each states, and a
# kernel's, admitted before any device is handed it.
tairix-spirv = { path = "../../../lib/spirv", version = "=0.0.0" }
# A WGSL kernel's bound, and the diagnostics its compile answers.
tairix-wgsl = { path = "../../../lib/wgsl", version = "=0.0.0" }
# The sandbox a WGSL kernel is compiled in: this binary as its own worker.
tairix-sandbox = { path = "../../../lib/sandbox", version = "=0.0.0", optional = true }
# The command line, read with the shared `getopt` and refused in its words.
tairix-util = { path = "../../../lib/util", version = "=0.0.0" }
# The short help read from the bundle's own Help/ tree.
tairix-help = { path = "../../../lib/help", version = "=0.0.0", optional = true }
# The served GPUs, listed by the System Information API.
tairix-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0", optional = true }
# The window `--present` shows the scene in, its frames filled by a swapchain.
tairix-window = { path = "../../../lib/window", version = "=0.0.0", optional = true, features = ["gpu"] }

[target.'cfg(target_os = "none")'.dependencies]
tairix-sandbox = { path = "../../../lib/sandbox", version = "=0.0.0", features = ["program"], optional = true }
# `_start`, the streams and the clock the program reads.
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
# The System Information API's IPC transport.
tairix-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0", features = ["program"], optional = true }
tairix-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"], optional = true }

[dev-dependencies]
# The kernels the MG3 vertical plants, each run here on the software device.
tairix-test-shadercheck = { path = "../../../tests/integration/shadercheck_program", version = "=0.0.0" }
# Modules the kernel tests write as assembly text.
tairix-spirv = { path = "../../../lib/spirv", version = "=0.0.0", features = ["test-support"] }
# The locales every help tree carries.
tairix-help = { path = "../../../lib/help", version = "=0.0.0" }
# The heap the unit tests refuse.
tairix-fuzzseed = { path = "../../../tests/fuzzseed", version = "=0.0.0" }

[build-dependencies]
tairix-buildcfg = { path = "../../../lib/buildcfg", version = "=0.0.0", features = ["std"] }
