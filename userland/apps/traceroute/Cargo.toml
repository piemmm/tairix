[package]
name = "tairix-traceroute"
description = "TAIRiX `traceroute` CLI: print the route echo probes take to a network host (`plans/NETMAP.md` NM-S3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding runtime and the socket-backed resolver are
# an on-by-default build feature, so host tooling builds only the pure library.
[features]
default = ["program"]
program = ["dep:tairix-rt", "tairix-resolver/program"]

[[bin]]
name = "tairix-traceroute-run"
path = "src/run.rs"

[dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-help = { path = "../../../lib/help", version = "=0.0.0" }
# The one path-trace engine `traceroute` and the network map both drive.
tairix-net = { path = "../../../lib/net", version = "=0.0.0" }
# The shared line-output seam command apps write through.
tairix-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0" }
tairix-resolver = { path = "../../../lib/resolver", version = "=0.0.0" }
tairix-util = { path = "../../../lib/util", version = "=0.0.0" }

[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
tairix-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
tairix-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0", features = ["program"] }
