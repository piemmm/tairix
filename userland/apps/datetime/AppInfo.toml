# Signed-AppInfo manifest source for the Date & Time dialog
# (plans/TIMEZONES.md TZ6). Discovered by the build's app-bundle composer,
# which cross-compiles Run, signs the manifest, and plants the bundle on the
# read-only /System/Components store; the desktop clock's "Set Date &
# Time..." menu row starts it through the system authorisation prompt.
# The capability list is the bundle's request:
#   - CAP_CONSOLE_WRITE for its fail-loud stderr diagnostics.
#   - CAP_SHM to create and grant the zero-copy window frame region the
#     desktop session maps.
#   - CAP_TIME_SET to step the machine's wall clock and set the clock chip,
#     which is the point of the dialog and the reason it is launched through
#     a re-authentication rather than by the session directly.
#   - CAP_SETTINGS_WRITE to ask the settings service to turn network time on
#     or off and to change the machine's time zone.
#   - CAP_FS_ACCESS to read the zone store and what the time service last
#     did.
# The launched process receives this set intersected with the launching
# user's grants, never more — so an account whose ceiling withholds one runs
# the dialog with that change refused, and the dialog states the refusal
# rather than pretending to have made it.
id = "os.tairix.datetime"
name = "datetime"
title = "Date & Time"
version = "0.1.0"
kind = "component"
# The identity the desktop's icon-bar information panel states, drawn from
# this *signed* manifest rather than from anything the running process says
# about itself (plans/NEW-TASKBAR.md).
purpose = "Set the machine's date and time"
author = "The TAIRiX Project"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_SHM", "CAP_TIME_SET", "CAP_SETTINGS_WRITE", "CAP_FS_ACCESS"]
# Deliberately no `library` key: this app is reached from the desktop clock's
# own menu, not from the program launcher, because it is useful only to
# somebody who can authenticate an account that may set the clock. The icon
# below is independent of that — it is the bundle's own identity, drawn
# wherever the bundle appears.
# This bundle's own 256x256 icon master in its Resources/ (plans/ICONS.md).
library-icon = "datetime.png"
