# Signed-AppInfo manifest source for beeb, the BBC Micro emulator
# (plans/BEEB.md). The build's app-bundle composer cross-compiles Run, signs
# this manifest, and plants the bundle on /System/Applications.
#
# No filesystem capability: the settings and installed ROM images live in the
# application's own store, and every disc, tape and snapshot is one the user
# handed over. The machine, guest code and every image being untrusted, runs
# in this binary re-entered as a capability-empty worker: CAP_SANDBOX_SPAWN
# starts it and CAP_SHM makes the region its picture crosses. CAP_CONSOLE_WRITE
# carries the stderr diagnostics, and CAP_LOG_EMIT records a worker ended for
# what it sent.
id = "os.tairix.beeb"
name = "beeb"
title = "BBC Micro"
version = "0.1.0"
kind = "application"
purpose = "Run a BBC Micro Model B and its software"
author = "The TAIRiX Project"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_SHM", "CAP_SANDBOX_SPAWN", "CAP_LOG_EMIT"]
associations = ["application/x-acorn-dfs-disc", "application/x-uef-tape", "application/x-csw-tape"]
# A disc image the user opens may be the machine's to write.
document-access = "read-write"
library = "Utilities"
library-icon = "beeb.png"
