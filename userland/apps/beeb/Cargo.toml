[package]
name = "tairix-beeb"
description = "TAIRiX beeb.app (plans/BEEB.md): a cycle-exact BBC Micro Model B, its disc, tape and snapshot formats, and the 6502 builder its clean-room ROMs are written with."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `no_std` + `alloc`, so the machine links unchanged into a freestanding
# binary. The ROM sources and the conformance-vector runner are host-only; the
# freestanding build never compiles them.
[lib]
name = "tairix_beeb"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# The sample encodings the worker's sound is carried in, the host's key
# edges, and the app-data name grammar an installed ROM's blob is held to.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The `key = value` grammar the settings are kept in.
tairix-appconf = { path = "../../../lib/appconf", version = "=0.0.0" }
# The machine's monitor in its window: the 4:3 picture, sharp or smooth, and
# the scan lines over it.
tairix-crt = { path = "../../../lib/crt", version = "=0.0.0" }
# The identifiers the emulator's diagnostic records are stated under.
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
# The settings window's frame and its rows, and the icons its categories
# wear.
tairix-controls = { path = "../../../lib/controls", version = "=0.0.0" }
tairix-icon = { path = "../../../lib/icon", version = "=0.0.0" }
tairix-window = { path = "../../../lib/window", version = "=0.0.0", default-features = false, features = [
    "settings",
] }
# The one resampler and the AC coupling the worker's sound passes through.
tairix-audio = { path = "../../../lib/audio", version = "=0.0.0" }
# gzip and zlib, which UEF and CSW tape images are compressed with, and the
# RLZ codec a snapshot's body is compressed with.
tairix-compress = { path = "../../../lib/compress", version = "=0.0.0" }
# The fingerprint a snapshot records each ROM by.
tairix-crypto = { path = "../../../lib/crypto", version = "=0.0.0" }
# The session the machine worker serves and the front end drives it over:
# its wire codec, its share and the supervised launcher.
tairix-sandbox = { path = "../../../lib/sandbox", version = "=0.0.0" }

# The package is both the host-tested machine and front-end model and the
# `Run` binary of the on-disk `beeb.app` bundle: a freestanding program on the
# native Tier-1 targets and an inert host stub elsewhere.
[[bin]]
name = "tairix-beeb-run"
path = "src/run.rs"

# Everything only the freestanding `Run` binary links.
[target.'cfg(target_os = "none")'.dependencies]
# The runtime: `_start`, the allocator, the files, the wait-set and the worker
# desks the files and the settings are served on.
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }
# The window channel, the app shell and the settings window's host.
tairix-window = { path = "../../../lib/window", version = "=0.0.0", features = ["settings"] }
# The bundle's own `Help/`, for `-h`.
tairix-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
# The session launcher and the worker role the machine runs in.
tairix-sandbox = { path = "../../../lib/sandbox", version = "=0.0.0", features = ["program"] }
# The application's own store: its settings and its installed ROM images.
tairix-appdata = { path = "../../../lib/appdata", version = "=0.0.0", features = ["rt"] }
# The audio service's live stream the machine's sound plays through.
tairix-audio = { path = "../../../lib/audio", version = "=0.0.0", features = ["rt"] }
# The content types a file offered to the window is judged by, and the save
# formats a picker offers.
tairix-browse = { path = "../../../lib/browse", version = "=0.0.0" }
# The CPUs the picture tube's pool is sized by.
tairix-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0", features = ["program"] }
# The glyph cache trimmed under memory pressure.
tairix-font = { path = "../../../lib/font", version = "=0.0.0" }
# The surface the window is drawn on, its regions and theme.
tairix-raster = { path = "../../../lib/raster", version = "=0.0.0" }
tairix-geometry = { path = "../../../lib/geometry", version = "=0.0.0" }
tairix-theme = { path = "../../../lib/theme", version = "=0.0.0" }
# The job queue the file worker's desk is built on.
tairix-util = { path = "../../../lib/util", version = "=0.0.0" }

[dev-dependencies]
# The CRC-32 a test's own gzip member is closed with.
tairix-crc32 = { path = "../../../lib/crc32", version = "=0.0.0" }
# The seeded PRNG and budgets the fuzz harnesses draw from.
tairix-fuzzseed = { path = "../../../tests/fuzzseed", version = "=0.0.0" }

[build-dependencies]
tairix-buildcfg = { path = "../../../lib/buildcfg", version = "=0.0.0", features = ["std"] }
