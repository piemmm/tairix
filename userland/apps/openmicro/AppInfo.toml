# Signed-AppInfo manifest source for OpenMicro, the Open Micro Emulator
# (plans/BEEB.md). The build's app-bundle composer cross-compiles Run, signs
# this manifest, and plants the bundle on /System/Applications.
#
# No filesystem capability: the machine library and installed ROM images live
# in the application's own store, every disc and tape it makes is in its
# documents folder, and any other is one the user handed over. Guest code and
# every image being untrusted, each machine runs in this binary re-entered as
# a capability-empty worker: CAP_SANDBOX_SPAWN starts it and CAP_SHM makes the
# region its picture crosses. CAP_CONSOLE_WRITE carries the stderr
# diagnostics, and CAP_LOG_EMIT its diagnostic events.
id = "os.tairix.openmicro"
name = "OpenMicro"
title = "Open Micro Emulator"
version = "0.1.0"
kind = "application"
purpose = "Run 8-bit microcomputers, the BBC Micro Model B and the Acorn Electron, and their software"
author = "The TAIRiX Project"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_SHM", "CAP_SANDBOX_SPAWN", "CAP_LOG_EMIT"]
associations = ["application/x-acorn-dfs-disc", "application/x-uef-tape", "application/x-csw-tape"]
# A disc image the user opens may be the machine's to write.
document-access = "read-write"
# The discs and tapes the machines make, by machine.
documents-folder = "Open Micro"
library = "Utilities"
library-icon = "OpenMicro.png"
