[package]
name = "tairix-riscos-kernel"
description = "TAIRiX Bridge's kernel: the guest address space over the processor's MMU, RISC OS 5's kernel SWIs performed in Rust over the guest's own memory, and the observation corpus it is held to. no_std, forbids unsafe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The processor whose MMU the address space is built on.
tairix-riscos-arm = { path = "../arm", version = "=0.0.0" }
# The area table and the address reservations, whose growth can refuse.
tairix-collections = { path = "../../../../../lib/collections", version = "=0.0.0" }
# An area's title, held inline.
tairix-inline = { path = "../../../../../lib/inline", version = "=0.0.0" }
# GSTrans, system variables, expressions and argument templates.
tairix-obey = { path = "../../../../../lib/obey", version = "=0.0.0" }
# RISC OS's Latin-1, which names and keys are folded through, and
# FileSwitch's attribute bits.
tairix-fsmeta = { path = "../../../../../lib/fsmeta", version = "=0.0.0" }
# The one civil-calendar arithmetic, days from a date and back, the 64-bit
# time it is read in, and the data file type TAIRiX's own files share.
tairix-abi = { path = "../../../../../lib/abi", version = "=0.0.0" }
# The TAIRiX locale's time zone, which the UK territory's zone is.
tairix-tz = { path = "../../../../../lib/tz", version = "=0.0.0" }
# The system font, which International draws each alphabet's characters
# from.
tairix-vdu = { path = "../../../../../lib/vdu", version = "=0.0.0" }
# Canonical composition, which composes a dead key's accent with the next
# character.
tairix-unicode = { path = "../../../../../lib/unicode", version = "=0.0.0" }
# Fallible copies of the guest's bytes.
tairix-util = { path = "../../../../../lib/util", version = "=0.0.0" }
# The memory pressure and the log the session's caches are made with.
tairix-reclaim = { path = "../../../../../lib/reclaim", version = "=0.0.0" }
tairix-log = { path = "../../../../../lib/log", version = "=0.0.0" }

[dev-dependencies]
# The seeded generator the fuzz harness draws from.
tairix-fuzzseed = { path = "../../../../../tests/fuzzseed", version = "=0.0.0" }
# The shipped zone store, compiled from IANA's rules: the history the reference
# machine's UK territory knows, for the territory's tests and the corpus replay.
tairix-tzcompile = { path = "../../../../../tools/tzcompile", version = "=0.0.0" }
