[package]
name = "tairix-riscos-arm"
description = "TAIRiX Bridge's ARM processor: the A32 and T32 encoding tables its decoders, interpreter, disassembler and encoders are derived from, the 26-bit and 32-bit programmer's models with Thumb state, the profiles that fix every implementation-defined choice, architectural exceptions, the FPA, VFP, Advanced SIMD and the Cryptographic Extension, and the guest MMU with its write watch. It knows nothing of RISC OS. no_std, forbids unsafe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The free-frame bitmap and the watch's frame map, whose growth can refuse.
tairix-collections = { path = "../../../../../lib/collections", version = "=0.0.0" }
# The checksums `CRC32` and `CRC32C` compute.
tairix-crc32 = { path = "../../../../../lib/crc32", version = "=0.0.0" }
tairix-crc32c = { path = "../../../../../lib/crc32c", version = "=0.0.0" }
# The arithmetic the FPA, VFP and Advanced SIMD compute through.
tairix-softfloat = { path = "../../../../../lib/softfloat", version = "=0.0.0" }

[dev-dependencies]
# The seeded generator the fuzz harness and the randomised tests draw from.
tairix-fuzzseed = { path = "../../../../../tests/fuzzseed", version = "=0.0.0" }
