# Signed-AppInfo manifest source for TAIRiXBridge, TAIRiX Bridge
# (plans/RISCOS-EMULATOR.md). The build's app-bundle composer cross-compiles
# Run, signs this manifest, and plants the bundle on /System/Applications.
#
# No filesystem capability: the user's own RISC OS disc is the application's
# documents folder, and any other file is one the user handed over. Guest code
# being untrusted, each session runs in this binary re-entered as a
# capability-empty worker: CAP_SANDBOX_SPAWN starts it and CAP_SHM makes the
# region its screens cross. CAP_CONSOLE_WRITE carries the stderr diagnostics,
# and CAP_LOG_EMIT its diagnostic events.
id = "os.tairix.bridge"
name = "TAIRiXBridge"
title = "TAIRiX Bridge"
version = "0.1.0"
kind = "application"
purpose = "Run RISC OS programs on the TAIRiX desktop"
author = "The TAIRiX Project"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_SHM", "CAP_SANDBOX_SPAWN", "CAP_LOG_EMIT"]
# A file the user runs may be the program's to write.
document-access = "read-write"
# The shared session's own disc.
documents-folder = "RISC OS"
library = "Utilities"
library-icon = "TAIRiXBridge.png"
