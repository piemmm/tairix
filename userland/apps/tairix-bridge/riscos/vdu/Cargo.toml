[package]
name = "tairix-riscos-vdu"
description = "TAIRiX Bridge's VDU drivers: screen modes and their memory, the VDU stream, OS_Plot, colours and palettes, the pointer, sprites, and the ScreenModes, ColourTrans, InverseTable, BlendTable, SpriteExtend and SpriteUtils modules, as RISC OS 5 has them, over guest memory. no_std, forbids unsafe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The kernel: the VDU drivers' seam, guest memory, SWIs, vectors and
# services.
tairix-riscos-kernel = { path = "../kernel", version = "=0.0.0" }
# The processor's flags, which some calls answer in.
tairix-riscos-arm = { path = "../arm", version = "=0.0.0" }
# A palette entry's colour and the RISC OS colour word that holds it.
tairix-colour = { path = "../../../../../lib/colour", version = "=0.0.0" }
# RISC OS 5's numbered modes, the control codes, the system font and the
# palettes' arithmetic.
tairix-vdu = { path = "../../../../../lib/vdu", version = "=0.0.0" }
# Sprite areas, control blocks, mode words and names: the format's one
# definition.
tairix-image = { path = "../../../../../lib/image", version = "=0.0.0" }
# Mode 7's character generator.
tairix-teletext = { path = "../../../../../lib/teletext", version = "=0.0.0" }
# Fallible containers for the flood fill's spans and loaded mode files.
tairix-collections = { path = "../../../../../lib/collections", version = "=0.0.0" }
# A number written out for a message's parameter.
tairix-util = { path = "../../../../../lib/util", version = "=0.0.0" }

[dev-dependencies]
# The seeded generator the fuzz harness draws from.
tairix-fuzzseed = { path = "../../../../../tests/fuzzseed", version = "=0.0.0" }
# The filing system and BASIC the recorded programs run under, and the
# session a test makes.
tairix-riscos-filing = { path = "../filing", version = "=0.0.0", features = ["test-support"] }
tairix-riscos-basic = { path = "../basic", version = "=0.0.0" }
# The in-memory tree the replay's HostFS disc is served over.
tairix-fscopy = { path = "../../../../../lib/fscopy", version = "=0.0.0", features = ["test-support"] }
