# Signed-AppInfo manifest source for `music.app`, the desktop player
# (plans/SOUND.md SND14). Discovered by the build's app-bundle composer, which
# cross-compiles Run, signs the manifest, and plants the bundle on the
# read-only /System/Applications store.
#
# No filesystem capability: the player reaches only the files the user hands
# it, as one-shot delegations from the session's trusted picker or the file
# manager. Playback asks for nothing either — the audio service authorises a
# stream against the session holding the speakers. CAP_CONSOLE_WRITE is for its
# fail-loud stderr diagnostics; CAP_SHM creates the window's frame region and
# the stream's ring; CAP_SANDBOX_SPAWN re-enters this binary as the
# capability-empty decoders no sound file and no album art is parsed outside;
# CAP_LOG_EMIT records a decoder replaced after it failed.
id = "os.tairix.music"
name = "music"
title = "Music"
version = "0.1.0"
kind = "application"
purpose = "Play your music"
author = "The TAIRiX Project"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_SHM", "CAP_SANDBOX_SPAWN", "CAP_LOG_EMIT"]
# Single instance, and deliberately: a file handed to the player from the file
# manager joins the one playlist rather than starting a second player over the
# first. Absent means single.
#
# The formats the decoder reads completely; the others are claimed with the
# decoders that read them (plans/SOUND.md).
associations = ["audio/flac", "audio/wav", "audio/basic"]
library = "Multimedia"
library-icon = "music.png"
