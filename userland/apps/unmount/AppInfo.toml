# Signed-AppInfo manifest source for the `unmount` command app
# (plans/APPS.md deliverable 8, plans/DEVICES.md D4b). Discovered by the
# build's app-bundle composer; the capability list is the bundle's
# request, intersected with the launching user's grants.
# CAP_CONSOLE_WRITE covers the inherited standard output/error streams;
# CAP_FS_ACCESS reads the tool's own bundle's Help/ documents through
# the secured VFS; CAP_FS_MOUNT is the tool's job — the kernel's
# volume_detach path requires the mount authority for any volume but a
# disk image or network share the caller attached, or a removable
# device's volume the user at the seat plainly detaches, and re-checks it
# on every call. The mount and view listings it resolves names against
# come from the ungated sysinfo-v1 MOUNT_LIST and VIEW_LIST queries
# served by sysinfod. It reads no standard input.
id = "os.tairix.unmount"
name = "unmount"
title = "Unmount"
version = "0.1.0"
kind = "command"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_FS_ACCESS", "CAP_FS_MOUNT"]
# This bundle's own 256x256 icon master in its Resources/ (plans/ICONS.md).
library-icon = "unmount.png"
