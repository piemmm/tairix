# Signed-AppInfo manifest source for PCEmulator, the PC/XT-class machine
# emulator (plans/PCEMU.md). The build's app-bundle composer cross-compiles
# Run, signs this manifest, and plants the bundle on /System/Applications.
#
# No filesystem capability: a machine's disks live in the application's own
# store, reached through the app-data service, and any other image is one the
# user handed over. The machine itself, guest code and every disk image being
# untrusted, runs in this binary re-entered as a capability-empty worker;
# CAP_SANDBOX_SPAWN starts it, and CAP_SHM makes the region its frames cross
# and the window's own. Its hot code is compiled by the binary re-entered as a
# second capability-empty sandbox, and CAP_JIT_MAP_EXEC moves that code into
# the worker read-execute; without it every machine is interpreted.
# CAP_CONSOLE_WRITE carries the stderr diagnostics, and CAP_LOG_EMIT records a
# worker ended for what it sent.
id = "os.tairix.pcemulator"
name = "PCEmulator"
title = "PC Emulator"
version = "0.1.0"
kind = "application"
purpose = "Run IBM PC and XT-class machines and their software"
author = "The TAIRiX Project"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_SHM", "CAP_SANDBOX_SPAWN", "CAP_JIT_MAP_EXEC", "CAP_LOG_EMIT"]
# A disk image the user picks may be the machine's to write.
document-access = "read-write"
library = "Utilities"
library-icon = "PCEmulator.png"
