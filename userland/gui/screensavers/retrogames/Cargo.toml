[package]
name = "tairix-saver-retrogames"
description = "TAIRiX Retro Games screensaver: a flight over a glowing wireframe grid towards a banded sun, where wireframe craft play out retro arcade games. The host-tested scene is the crate's [lib]; the freestanding `Run` binary is the on-disk RetroGames.app bundle's entry point, serving it over lib/saver in the drawing sandbox."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "tairix_saver_retrogames"
path = "src/lib.rs"

# The `Run` entry point of the on-disk `RetroGames.app` bundle: freestanding on
# the native Tier-1 targets, an inert host stub elsewhere (`build.rs`).
[[bin]]
name = "tairix-saver-retrogames-run"
path = "src/run.rs"

[dependencies]
tairix-abi = { path = "../../../../lib/abi", version = "=0.0.0" }
tairix-geometry = { path = "../../../../lib/geometry", version = "=0.0.0" }
# The bounded, allocation-free lists the craft and the floor's ripples are kept in.
tairix-inline = { path = "../../../../lib/inline", version = "=0.0.0" }
# The pool each frame's bands are painted across.
tairix-parallel = { path = "../../../../lib/parallel", version = "=0.0.0" }
tairix-raster = { path = "../../../../lib/raster", version = "=0.0.0" }
tairix-rng = { path = "../../../../lib/rng", version = "=0.0.0" }
tairix-saver = { path = "../../../../lib/saver", version = "=0.0.0" }
# The scene clock the flight is paced by.
tairix-theme = { path = "../../../../lib/theme", version = "=0.0.0" }
# The float functions the projection and the ripples need.
tairix-util = { path = "../../../../lib/util", version = "=0.0.0" }

# The `Run` binary is a userland program serving the saver protocol over its
# standard streams. Bare-metal only.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../../lib/rt", version = "=0.0.0" }
tairix-saver = { path = "../../../../lib/saver", version = "=0.0.0", features = ["program"] }

[dev-dependencies]
tairix-saver = { path = "../../../../lib/saver", version = "=0.0.0", features = ["test-support"] }
# The order-shuffling and threaded runners a frame is proven bit-identical
# across.
tairix-parallel = { path = "../../../../lib/parallel", version = "=0.0.0", features = ["test-util"] }

[lints]
workspace = true

[build-dependencies]
tairix-buildcfg = { path = "../../../../lib/buildcfg", version = "=0.0.0", features = ["std"] }
