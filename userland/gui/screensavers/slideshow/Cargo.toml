[package]
name = "tairix-saver-slideshow"
description = "TAIRiX Slideshow screensaver: the shipped pictures, one after another, read and fitted by its host. The host-tested scene is the crate's [lib]; the freestanding `Run` binary is the on-disk Slideshow.app bundle's entry point, serving it over lib/saver in the drawing sandbox."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "tairix_saver_slideshow"
path = "src/lib.rs"

# The `Run` entry point of the on-disk `Slideshow.app` bundle: freestanding on
# the native Tier-1 targets, an inert host stub elsewhere (`build.rs`).
[[bin]]
name = "tairix-saver-slideshow-run"
path = "src/run.rs"

[dependencies]
tairix-abi = { path = "../../../../lib/abi", version = "=0.0.0" }
tairix-geometry = { path = "../../../../lib/geometry", version = "=0.0.0" }
tairix-raster = { path = "../../../../lib/raster", version = "=0.0.0" }
# The shuffle's generator.
tairix-rng = { path = "../../../../lib/rng", version = "=0.0.0" }
tairix-saver = { path = "../../../../lib/saver", version = "=0.0.0" }

# The `Run` binary is a userland program serving the saver protocol over its
# standard streams. Bare-metal only.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../../lib/rt", version = "=0.0.0" }
tairix-saver = { path = "../../../../lib/saver", version = "=0.0.0", features = ["program"] }

[dev-dependencies]
tairix-saver = { path = "../../../../lib/saver", version = "=0.0.0", features = ["test-support"] }

[lints]
workspace = true

[build-dependencies]
tairix-buildcfg = { path = "../../../../lib/buildcfg", version = "=0.0.0", features = ["std"] }
