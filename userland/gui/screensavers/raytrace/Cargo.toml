[package]
name = "tairix-saver-raytrace"
description = "TAIRiX Ray Tracer screensaver: scenes composed at random, revealed coarse to fine on threads of its own, held, faded and followed by another. The host-tested scene is the crate's [lib]; the freestanding `Run` binary is the on-disk Raytrace.app bundle's entry point, serving it over lib/saver in the drawing sandbox."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The long host tests that prepare or trace a whole ray-traced scene, run by
# `ci-long` and `cargo xtask test --scenes` rather than `ci`.
scene-tests = []

[lib]
name = "tairix_saver_raytrace"
path = "src/lib.rs"

# The `Run` entry point of the on-disk `Raytrace.app` bundle: freestanding on
# the native Tier-1 targets, an inert host stub elsewhere (`build.rs`).
[[bin]]
name = "tairix-saver-raytrace-run"
path = "src/run.rs"

[dependencies]
tairix-abi = { path = "../../../../lib/abi", version = "=0.0.0" }
tairix-geometry = { path = "../../../../lib/geometry", version = "=0.0.0" }
# The tracing thread's pool and the frames' runner.
tairix-parallel = { path = "../../../../lib/parallel", version = "=0.0.0" }
tairix-raster = { path = "../../../../lib/raster", version = "=0.0.0" }
# The tracer, its settings and its scene composer.
tairix-raytrace = { path = "../../../../lib/raytrace", version = "=0.0.0" }
# The memory band a scene's detail answers to.
tairix-reclaim = { path = "../../../../lib/reclaim", version = "=0.0.0" }
tairix-rng = { path = "../../../../lib/rng", version = "=0.0.0" }
# The tracing thread, its desk's lock and the monotonic clock its work is paced by.
tairix-rt = { path = "../../../../lib/rt", version = "=0.0.0" }
tairix-saver = { path = "../../../../lib/saver", version = "=0.0.0" }
# The fades, the scene clock and the readout's type.
tairix-theme = { path = "../../../../lib/theme", version = "=0.0.0" }
# The readout's text, relayed through the host.
tairix-font = { path = "../../../../lib/font", version = "=0.0.0" }
tairix-util = { path = "../../../../lib/util", version = "=0.0.0" }

# The `Run` binary is a userland program serving the saver protocol over its
# standard streams. Bare-metal only.
[target.'cfg(target_os = "none")'.dependencies]
tairix-saver = { path = "../../../../lib/saver", version = "=0.0.0", features = ["program"] }

[dev-dependencies]
tairix-saver = { path = "../../../../lib/saver", version = "=0.0.0", features = ["test-support"] }
# The order-shuffling and threaded runners the reveal is proven against.
tairix-parallel = { path = "../../../../lib/parallel", version = "=0.0.0", features = ["test-util"] }
# The readout's text drawn through the shared test transport.
tairix-font = { path = "../../../../lib/font", version = "=0.0.0", features = ["test-util"] }

[lints]
workspace = true

[build-dependencies]
tairix-buildcfg = { path = "../../../../lib/buildcfg", version = "=0.0.0", features = ["std"] }
