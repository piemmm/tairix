[package]
name = "tairix-saver-life"
description = "TAIRiX Life screensaver: Conway's Game of Life, its colonies coloured by descent and age. The host-tested scene is the crate's [lib]; the freestanding `Run` binary is the on-disk Life.app bundle's entry point, serving it over lib/saver in the drawing sandbox."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "tairix_saver_life"
path = "src/lib.rs"

# The `Run` entry point of the on-disk `Life.app` bundle: freestanding on
# the native Tier-1 targets, an inert host stub elsewhere (`build.rs`).
[[bin]]
name = "tairix-saver-life-run"
path = "src/run.rs"

[dependencies]
tairix-abi = { path = "../../../../lib/abi", version = "=0.0.0" }
tairix-geometry = { path = "../../../../lib/geometry", version = "=0.0.0" }
tairix-raster = { path = "../../../../lib/raster", version = "=0.0.0" }
tairix-rng = { path = "../../../../lib/rng", version = "=0.0.0" }
tairix-saver = { path = "../../../../lib/saver", version = "=0.0.0" }
# The scene clock every idle scene is paced by.
tairix-theme = { path = "../../../../lib/theme", version = "=0.0.0" }
# The board's fallible allocation.
tairix-util = { path = "../../../../lib/util", version = "=0.0.0" }

# The `Run` binary is a userland program serving the saver protocol over its
# standard streams. Bare-metal only.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../../lib/rt", version = "=0.0.0" }
tairix-saver = { path = "../../../../lib/saver", version = "=0.0.0", features = ["program"] }

[dev-dependencies]
tairix-saver = { path = "../../../../lib/saver", version = "=0.0.0", features = ["test-support"] }

[lints]
workspace = true

[build-dependencies]
tairix-buildcfg = { path = "../../../../lib/buildcfg", version = "=0.0.0", features = ["std"] }
